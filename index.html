<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中医经典等级考试｜经典复习站</title>
<style>
:root{
  --bg:#121416;
  --card:#1c2024;
  --text:#e6e6e6;
  --muted:#99a2aa;
  --primary:#c84b31;
  --accent:#2b6777;
  --border:#333a42;
  --success:#38a169;
  --danger:#e53e3e;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,serif}
body{background:var(--bg);color:var(--text);padding:16px;max-width:720px;margin:0 auto;line-height:1.65}
header{margin-bottom:20px}
h1{font-size:28px;font-weight:500;margin-bottom:6px}
.desc{color:var(--muted)}
.panel{background:var(--card);border-radius:14px;padding:18px;border:1px solid var(--border);margin-bottom:16px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.stat-item h3{font-size:26px;margin-bottom:4px}
.stat-item p{color:var(--muted);font-size:14px}
.tab-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer}
.tab.active{border-color:var(--primary);color:var(--text);background:rgba(200,75,49,0.12)}
.ctrl-bar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
button{padding:11px 14px;border-radius:10px;border:none;font-size:15px;cursor:pointer}
.btn-main{background:var(--primary);color:white}
.btn-alt{background:var(--accent);color:white}
.btn-gray{background:#30363d;color:var(--text)}
.question-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}
.q-title{font-size:18px;margin-bottom:20px}
.opt{padding:14px;border:1px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer}
.opt:hover{border-color:var(--accent)}
.opt.right{border-color:var(--success);background:rgba(56,161,105,0.1)}
.opt.wrong{border-color:var(--danger);background:rgba(229,62,62,0.1)}
.opt.disabled{pointer-events:none;opacity:0.85}
.ans-box{margin-top:16px;padding:14px;background:rgba(43,103,119,0.1);border-radius:10px;display:none}
.ans-box.show{display:block}
.nav-row{display:flex;gap:10px;margin-top:22px}
.rate-row{display:flex;gap:8px;margin-top:14px}
.rate-btn{flex:1}
.rate-btn.active{outline:2px solid var(--primary)}
.info-line{color:var(--muted);font-size:14px;margin-bottom:8px}
#filterTip{color:var(--muted);margin:8px 0}
</style>
</head>
<body>
<header>
  <h1>中医经典等级考试复习</h1>
  <div class="desc">内经 · 伤寒 · 金匮 · 温病｜间隔记忆刷题</div>
</header>
<div class="panel stats">
  <div class="stat-item"><h3 id="total">0</h3><p>总题库</p></div>
  <div class="stat-item"><h3 id="done">0</h3><p>已作答</p></div>
  <div class="stat-item"><h3 id="master">0</h3><p>已掌握</p></div>
</div>
<div class="tab-bar" id="tabWrap">
  <div class="tab active" data-subject="all">全部</div>
  <div class="tab" data-subject="neijing">素问/灵枢</div>
  <div class="tab" data-subject="shanghan">伤寒论</div>
  <div class="tab" data-subject="jinkui">金匮要略</div>
  <div class="tab" data-subject="wenbing">温病</div>
</div>
<div class="ctrl-bar">
  <button class="btn-alt" id="wrongBtn">只看错题</button>
  <button class="btn-gray" id="resetBtn">重置本套</button>
</div>
<div id="filterTip"></div>
<div class="question-card" id="qWrap">
  <div class="info-line"><span id="subjectTag"></span>｜题号 <span id="qIndex"></span></div>
  <div class="q-title" id="qText"></div>
  <div id="optWrap"></div>
  <div class="ans-box" id="ansWrap">
    <strong>解析：</strong><div id="ansText"></div>
  </div>
  <div class="nav-row">
    <button class="btn-gray" id="prevBtn">上一题</button>
    <button class="btn-gray" id="nextBtn">下一题</button>
    <button class="btn-alt" id="showAnsBtn">查看解析</button>
  </div>
  <div class="rate-row">
    <button class="btn-gray rate-btn" data-rate="3">✅ 掌握</button>
    <button class="btn-gray rate-btn" data-rate="2">⚠️ 模糊</button>
    <button class="btn-gray rate-btn" data-rate="1">❌ 不会</button>
  </div>
</div>

<script>
const questionList = [
// ========== 内经 100题 ==========
{sub:"neijing",q:"《素问·上古天真论》女子二七，生理变化为？",opt:["任脉通，太冲脉盛，月事以时下","肾气盛，齿更发长","任脉虚，太冲脉衰少","筋骨坚，发长极，身体盛壮"],ans:0,exp:"原文：女子二七而天癸至，任脉通，太冲脉盛，月事以时下，故有子。"},
{sub:"neijing",q:"《素问·上古天真论》男子二八，生理变化为？",opt:["肾气盛，齿更发长","天癸至，精气溢泻","筋骨隆盛，肌肉满壮","肾气衰，发堕齿槁"],ans:1,exp:"男子二八，肾气盛，天癸至，精气溢泻，阴阳和，故能有子。"},
{sub:"neijing",q:"《素问·阴阳应象大论》：阴在内，____；阳在外，____。",opt:["阳之守也，阴之使也","阳之使也，阴之守也","阴之守也，阳之使也","阴之使也，阳之守也"],ans:0,exp:"阴在内，阳之守也；阳在外，阴之使也，是阴阳互根核心句。"},
{sub:"neijing",q:"《素问·阴阳应象大论》善诊者，察色按脉，先别？",opt:["表里","虚实","阴阳","寒热"],ans:2,exp:"善诊者，察色按脉，先别阴阳。"},
{sub:"neijing",q:"《素问·灵兰秘典论》被称作“君主之官”的是？",opt:["肝","心","脾","肺"],ans:1,exp:"心者，君主之官也，神明出焉。"},
{sub:"neijing",q:"《素问·灵兰秘典论》“相傅之官”是？",opt:["肺","肝","胆","肾"],ans:0,exp:"肺者，相傅之官，治节出焉。"},
{sub:"neijing",q:"《素问·灵兰秘典论》“将军之官”为？",opt:["脾","肝","胃","三焦"],ans:1,exp:"肝者，将军之官，谋虑出焉。"},
{sub:"neijing",q:"《素问·灵兰秘典论》“中正之官”指？",opt:["心包","胆","膀胱","小肠"],ans:1,exp:"胆者，中正之官，决断出焉。"},
{sub:"neijing",q:"《素问·灵兰秘典论》“受盛之官”是？",opt:["大肠","小肠","胃","三焦"],ans:1,exp:"小肠者，受盛之官，化物出焉。"},
{sub:"neijing",q:"《素问·灵兰秘典论》“传导之官”为？",opt:["胃","大肠","膀胱","三焦"],ans:1,exp:"大肠者，传导之官，变化出焉。"},
{sub:"neijing",q:"《素问·灵兰秘典论》“州都之官”是？",opt:["肾","膀胱","三焦","心包"],ans:1,exp:"膀胱者，州都之官，津液藏焉，气化则能出矣。"},
{sub:"neijing",q:"《素问·灵兰秘典论》“决渎之官”指？",opt:["三焦","胆","肺","肾"],ans:0,exp:"三焦者，决渎之官，水道出焉。"},
{sub:"neijing",q:"《素问·生气通天论》：阳气者，若____，失其所则折寿而不彰。",opt:["日月","天日","江河","五谷"],ans:1,exp:"阳气者，若天与日，失其所则折寿而不彰。"},
{sub:"neijing",q:"《素问·生气通天论》，汗出偏沮，使人？",opt:["偏枯","痿厥","大偻","痤疿"],ans:0,exp:"汗出偏沮，使人偏枯。"},
{sub:"neijing",q:"《素问·举痛论》：百病生于____也。",opt:["风","寒","气","湿"],ans:2,exp:"余知百病生于气也。怒则气上，喜则气缓，悲则气消，恐则气下。"},
{sub:"neijing",q:"《素问·举痛论》怒则气？",opt:["上","缓","消","下"],ans:0,exp:"怒则气上。"},
{sub:"neijing",q:"《素问·举痛论》喜则气？",opt:["上","缓","消","结"],ans:1,exp:"喜则气缓。"},
{sub:"neijing",q:"《素问·举痛论》悲则气？",opt:["收","消","耗","乱"],ans:1,exp:"悲则气消。"},
{sub:"neijing",q:"《素问·举痛论》恐则气？",opt:["下","乱","耗","结"],ans:0,exp:"恐则气下。"},
{sub:"neijing",q:"《素问·举痛论》思则气？",opt:["耗","结","乱","收"],ans:1,exp:"思则气结。"},
{sub:"neijing",q:"《素问·痹论》风寒湿三气杂至，合而为痹，风气胜者为？",opt:["痛痹","着痹","行痹","骨痹"],ans:2,exp:"风气胜为行痹；寒气胜为痛痹；湿气胜为着痹。"},
{sub:"neijing",q:"《素问·痹论》寒气胜者为？",opt:["行痹","痛痹","着痹","筋痹"],ans:1,exp:"寒气胜者为痛痹。"},
{sub:"neijing",q:"《素问·痹论》湿气胜者为？",opt:["痛痹","行痹","着痹","脉痹"],ans:2,exp:"湿气胜者为着痹。"},
{sub:"neijing",q:"《素问·痿论》痿证独取何经？",opt:["足少阴","足阳明","足厥阴","足太阳"],ans:1,exp:"治痿独取阳明，阳明为五脏六腑之海，主润宗筋。"},
{sub:"neijing",q:"《素问·痿论》肺热叶焦，发为？",opt:["脉痿","筋痿","肉痿","痿躄"],ans:3,exp:"肺热叶焦，则皮毛虚弱急薄，著则生痿躄也。"},
{sub:"neijing",q:"《灵枢·本神》随神往来者谓之？",opt:["魂","魄","意","志"],ans:0,exp:"随神往来者谓之魂；并精而出入者谓之魄。"},
{sub:"neijing",q:"《灵枢·本神》并精而出入者谓之？",opt:["魂","魄","意","志"],ans:1,exp:"并精而出入者谓之魄。"},
{sub:"neijing",q:"《灵枢·本神》心有所忆谓之？",opt:["思","意","虑","智"],ans:1,exp:"心有所忆谓之意。"},
{sub:"neijing",q:"《灵枢·本神》意之所存谓之？",opt:["志","思","虑","智"],ans:0,exp:"意之所存谓之志。"},
{sub:"neijing",q:"《灵枢·本输》六腑之合，胃合于？",opt:["三里","巨虚上廉","巨虚下廉","阳陵泉"],ans:0,exp:"胃合于三里，大肠合入于巨虚上廉，小肠合入于巨虚下廉。"},
{sub:"neijing",q:"《灵枢·水胀》石瘕生于？",opt:["胞中","肠间","筋脉","皮部"],ans:0,exp:"石瘕生于胞中，寒气客于子门。"},
{sub:"neijing",q:"《灵枢·水胀》肠覃病位在？",opt:["胞中","肠外","肝经","冲脉"],ans:1,exp:"肠覃乃寒气客于肠外，与卫气相搏。"},
{sub:"neijing",q:"《素问·脉要精微论》夫脉者，血之____也。",opt:["府","隧","道","舍"],ans:0,exp:"夫脉者，血之府也。"},
{sub:"neijing",q:"《素问·脉要精微论》中，头者，____之府。",opt:["髓","精明","筋","血"],ans:1,exp:"头者，精明之府。"},
{sub:"neijing",q:"《素问·脉要精微论》背者，____之府。",opt:["肾","胸","心","肺"],ans:1,exp:"背者，胸中之府。"},
{sub:"neijing",q:"《素问·脉要精微论》腰者，____之府。",opt:["肝","脾","肾","命门"],ans:2,exp:"腰者，肾之府。"},
{sub:"neijing",q:"《素问·脉要精微论》膝者，____之府。",opt:["筋","骨","血","髓"],ans:0,exp:"膝者，筋之府。"},
{sub:"neijing",q:"《素问·脉要精微论》骨者，____之府。",opt:["精","髓","血","气"],ans:1,exp:"骨者，髓之府。"},
{sub:"neijing",q:"《素问·汤液醪醴论》水肿治疗，开鬼门是指？",opt:["利小便","发汗","逐水","放血"],ans:1,exp:"开鬼门=发汗；洁净府=利小便。"},
{sub:"neijing",q:"《素问·汤液醪醴论》洁净府指？",opt:["发汗","利小便","涌吐","攻下"],ans:1,exp:"洁净府，即通利小便。"},
{sub:"neijing",q:"《素问·至真要大论》：诸风掉眩，皆属于？",opt:["心","肝","脾","肺"],ans:1,exp:"诸风掉眩，皆属于肝。"},
{sub:"neijing",q:"《素问·至真要大论》诸寒收引，皆属于？",opt:["肾","肝","脾","心"],ans:0,exp:"诸寒收引，皆属于肾。"},
{sub:"neijing",q:"《素问·至真要大论》诸气膹郁，皆属于？",opt:["肺","肝","脾","三焦"],ans:0,exp:"诸气膹郁，皆属于肺。"},
{sub:"neijing",q:"《素问·至真要大论》诸湿肿满，皆属于？",opt:["肾","脾","肺","膀胱"],ans:1,exp:"诸湿肿满，皆属于脾。"},
{sub:"neijing",q:"《素问·至真要大论》诸热瞀瘛，皆属于？",opt:["心","肝","心包","胆"],ans:0,exp:"诸热瞀瘛，皆属于火（心）。"},
{sub:"neijing",q:"《素问·至真要大论》诸痛痒疮，皆属于？",opt:["火","心","风","毒"],ans:1,exp:"诸痛痒疮，皆属于心。"},
{sub:"neijing",q:"《素问·至真要大论》诸厥固泄，皆属于？",opt:["下","上","中","三焦"],ans:0,exp:"诸厥固泄，皆属于下。"},
{sub:"neijing",q:"《素问·至真要大论》诸痿喘呕，皆属于？",opt:["上","下","肺","胃"],ans:0,exp:"诸痿喘呕，皆属于上。"},
{sub:"neijing",q:"《素问·至真要大论》诸禁鼓栗，如丧神守，皆属于？",opt:["寒","火","风","湿"],ans:1,exp:"诸禁鼓栗，如丧神守，皆属于火。"},
{sub:"neijing",q:"《素问·至真要大论》诸痉项强，皆属于？",opt:["湿","风","寒","燥"],ans:0,exp:"诸痉项强，皆属于湿。"},
{sub:"neijing",q:"《素问·四气调神大论》春三月，此谓？",opt:["发陈","蕃秀","容平","闭藏"],ans:0,exp:"春三月，此谓发陈；夏蕃秀；秋容平；冬闭藏。"},
{sub:"neijing",q:"《素问·四气调神大论》夏三月，此谓？",opt:["发陈","蕃秀","容平","闭藏"],ans:1,exp:"夏三月，此谓蕃秀。"},
{sub:"neijing",q:"《素问·四气调神大论》秋三月，此谓？",opt:["发陈","蕃秀","容平","闭藏"],ans:2,exp:"秋三月，此谓容平。"},
{sub:"neijing",q:"《素问·四气调神大论》冬三月，此谓？",opt:["发陈","蕃秀","容平","闭藏"],ans:3,exp:"冬三月，此谓闭藏。"},
{sub:"neijing",q:"《素问·四气调神大论》圣人不治已病治？",opt:["已乱","未病","已变","未变"],ans:1,exp:"圣人不治已病治未病，不治已乱治未乱。"},
{sub:"neijing",q:"《素问·金匮真言论》善病鼽衄的季节是？",opt:["春","夏","秋","冬"],ans:0,exp:"春善病鼽衄。"},
{sub:"neijing",q:"《素问·金匮真言论》善病胸胁的季节是？",opt:["春","夏","长夏","秋"],ans:1,exp:"夏善病胸胁。"},
{sub:"neijing",q:"《素问·金匮真言论》善病洞泄寒中的季节？",opt:["春","夏","长夏","冬"],ans:2,exp:"长夏善病洞泄寒中。"},
{sub:"neijing",q:"《素问·金匮真言论》善病风疟的季节？",opt:["夏","长夏","秋","冬"],ans:2,exp:"秋善病风疟。"},
{sub:"neijing",q:"《素问·金匮真言论》善病痹厥的季节？",opt:["秋","冬","春","夏"],ans:1,exp:"冬善病痹厥。"},
{sub:"neijing",q:"《素问·生气通天论》膏粱厚味，足生？",opt:["大丁","痿厥","偏枯","痤疿"],ans:0,exp:"膏粱厚味，足生大丁（疔疮）。"},
{sub:"neijing",q:"《素问·生气通天论》汗出见湿，乃生？",opt:["痤疿","偏枯","大偻","痿厥"],ans:0,exp:"汗出见湿，乃生痤疿。"},
{sub:"neijing",q:"《素问·脉要精微论》脉来如鱼之游在波，是？",opt:["肝平脉","心平脉","脾平脉","肾平脉"],ans:0,exp:"肝脉来，软弱招招，如揭长竿末梢；如鱼之游在波为肝平。"},
{sub:"neijing",q:"《素问·脉要精微论》脉洪大，来盛去衰，为何脏平脉？",opt:["心","肝","脾","肺"],ans:0,exp:"心脉平，脉来累累如连珠，如循琅玕，来盛去衰。"},
{sub:"neijing",q:"《素问·宣明五气》五脏所藏：心藏？",opt:["神","魂","魄","志"],ans:0,exp:"心藏神，肝藏魂，肺藏魄，脾藏意，肾藏志。"},
{sub:"neijing",q:"《素问·宣明五气》肝藏？",opt:["神","魂","魄","意"],ans:1,exp:"肝藏魂。"},
{sub:"neijing",q:"《素问·宣明五气》肺藏？",opt:["魂","魄","意","志"],ans:1,exp:"肺藏魄。"},
{sub:"neijing",q:"《素问·宣明五气》脾藏？",opt:["魂","魄","意","志"],ans:2,exp:"脾藏意。"},
{sub:"neijing",q:"《素问·宣明五气》肾藏？",opt:["魂","魄","意","志"],ans:3,exp:"肾藏志。"},
{sub:"neijing",q:"《素问·宣明五气》久视伤？",opt:["血","气","肉","骨"],ans:0,exp:"久视伤血，久卧伤气，久坐伤肉，久立伤骨，久行伤筋。"},
{sub:"neijing",q:"《素问·宣明五气》久卧伤？",opt:["血","气","肉","筋"],ans:1,exp:"久卧伤气。"},
{sub:"neijing",q:"《素问·宣明五气》久坐伤？",opt:["气","肉","骨","筋"],ans:1,exp:"久坐伤肉。"},
{sub:"neijing",q:"《素问·宣明五气》久立伤？",opt:["肉","骨","筋","血"],ans:1,exp:"久立伤骨。"},
{sub:"neijing",q:"《素问·宣明五气》久行伤？",opt:["骨","筋","血","气"],ans:1,exp:"久行伤筋。"},
{sub:"neijing",q:"《灵枢·百病始生》风雨袭虚，则病起于？",opt:["上部","下部","中部","五脏"],ans:0,exp:"风雨袭虚，病起于上；清湿袭虚，病起于下。"},
{sub:"neijing",q:"《灵枢·百病始生》清湿袭虚，病起于？",opt:["上","下","中","六腑"],ans:1,exp:"清湿袭虚，则病起于下。"},
{sub:"neijing",q:"《素问·刺热》肝热病者，面色？",opt:["左颊先赤","右颊先赤","额先赤","颏先赤"],ans:0,exp:"肝热左颊先赤；肺热右颊先赤；心热额先赤；肾热颏先赤；脾热鼻先赤。"},
{sub:"neijing",q:"《素问·刺热》肺热病者？",opt:["左颊赤","右颊赤","额赤","鼻赤"],ans:1,exp:"肺热，右颊先赤。"},
{sub:"neijing",q:"《素问·刺热》心热病者？",opt:["额先赤","颏先赤","鼻先赤","右颊赤"],ans:0,exp:"心热病，额先赤。"},
{sub:"neijing",q:"《素问·刺热》脾热病者？",opt:["鼻先赤","颏先赤","额先赤","左颊赤"],ans:0,exp:"脾热病，鼻先赤。"},
{sub:"neijing",q:"《素问·刺热》肾热病者？",opt:["颏先赤","鼻先赤","额先赤","右颊赤"],ans:0,exp:"肾热病，颏先赤。"},
{sub:"neijing",q:"《素问·标本病传论》先病而后逆者，治其？",opt:["本","标","标本同治","独治标"],ans:0,exp:"先病而后逆者治其本；先逆而后病者治其本。"},
{sub:"neijing",q:"《素问·标本病传论》先热而后生中满者，治其？",opt:["标","本","标本","不必治"],ans:0,exp:"中满、大小不利为急，治其标。"},
{sub:"neijing",q:"《素问·五常政大论》大毒治病，十去其？",opt:["六","七","八","九"],ans:0,exp:"大毒治病，十去其六；常毒治病，十去其七；小毒治病，十去其八；无毒治病，十去其九。"},
{sub:"neijing",q:"《素问·五常政大论》常毒治病，十去其？",opt:["六","七","八","九"],ans:1,exp:"常毒治病，十去其七。"},
{sub:"neijing",q:"《素问·五常政大论》小毒治病，十去其？",opt:["六","七","八","九"],ans:2,exp:"小毒治病，十去其八。"},
{sub:"neijing",q:"《素问·五常政大论》无毒治病，十去其？",opt:["六","七","八","九"],ans:3,exp:"无毒治病，十去其九。"},
{sub:"neijing",q:"《灵枢·营卫生会》营气循脉，周行一身，一日多少周？",opt:["五十","二十六","十二","八十"],ans:0,exp:"营卫五十而复大会。"},
{sub:"neijing",q:"《灵枢·营卫生会》上焦如？",opt:["雾","沤","渎","衡"],ans:0,exp:"上焦如雾，中焦如沤，下焦如渎。"},
{sub:"neijing",q:"《灵枢·营卫生会》中焦如？",opt:["雾","沤","渎","衡"],ans:1,exp:"中焦如沤。"},
{sub:"neijing",q:"《灵枢·营卫生会》下焦如？",opt:["雾","沤","渎","权"],ans:2,exp:"下焦如渎。"},
{sub:"neijing",q:"《素问·调经论》阳虚则？",opt:["外寒","内热","外热","内寒"],ans:0,exp:"阳虚则外寒；阴虚则内热；阳盛则外热；阴盛则内寒。"},
{sub:"neijing",q:"《素问·调经论》阴虚则？",opt:["外寒","内热","外热","内寒"],ans:1,exp:"阴虚则内热。"},
{sub:"neijing",q:"《素问·调经论》阳盛则？",opt:["外寒","内热","外热","内寒"],ans:2,exp:"阳盛则外热。"},
{sub:"neijing",q:"《素问·调经论》阴盛则？",opt:["外寒","内热","外热","内寒"],ans:3,exp:"阴盛则内寒。"},
{sub:"neijing",q:"《素问·骨空论》督脉者，起于？",opt:["少腹以下骨中央","胞中","肾下","气街"],ans:0,exp:"督脉起于少腹以下骨中央。"},
{sub:"neijing",q:"《素问·骨空论》任脉为病，男子内结七疝，女子？",opt:["带下瘕聚","不孕","崩漏","癥瘕"],ans:0,exp:"任脉为病，男子内结七疝，女子带下瘕聚。"},
{sub:"neijing",q:"《素问·至真要大论》诸转反戾，水液浑浊，皆属于？",opt:["热","寒","湿","风"],ans:0,exp:"诸转反戾，水液浑浊，皆属于热。"},
{sub:"neijing",q:"《素问·至真要大论》诸病水液，澄澈清冷，皆属于？",opt:["寒","热","湿","燥"],ans:0,exp:"诸病水液，澄澈清冷，皆属于寒。"},
{sub:"neijing",q:"《灵枢·口问》上气不足，____为之不满。",opt:["脑","胸","腹","四肢"],ans:0,exp:"上气不足，脑为之不满，耳为之苦鸣。"},
  // ========== 伤寒论 100题 ==========
{sub:"shanghan",q:"太阳病，头痛发热，身疼腰痛，骨节疼痛，恶风，无汗而喘者，治宜？",opt:["桂枝汤","麻黄汤","葛根汤","大青龙汤"],ans:1,exp:"麻黄汤证：太阳伤寒表实，无汗、身痛、喘。"},
{sub:"shanghan",q:"太阳中风，阳浮而阴弱，阳浮者热自发，阴弱者汗自出，宜？",opt:["麻黄汤","桂枝汤","桂枝加葛根汤","桂枝加厚朴杏子汤"],ans:1,exp:"桂枝汤，太阳中风表虚，发热汗出恶风。"},
{sub:"shanghan",q:"太阳病，项背强几几，无汗恶风，方用？",opt:["桂枝加葛根汤","葛根汤","麻黄汤","桂枝汤"],ans:1,exp:"葛根汤：太阳伤寒兼经输不利；桂枝加葛根汤是有汗。"},
{sub:"shanghan",q:"太阳病，项背强几几，反汗出恶风者，方？",opt:["葛根汤","桂枝加葛根汤","麻黄加术汤","栝蒌桂枝汤"],ans:1,exp:"桂枝加葛根汤，中风有汗、项背拘急。"},
{sub:"shanghan",q:"喘家，作桂枝汤，加____佳。",opt:["杏仁","厚朴","苏子","半夏"],ans:1,exp:"桂枝加厚朴杏子汤，宿喘外感。"},
{sub:"shanghan",q:"发汗后，身疼痛，脉沉迟者，何方主之？",opt:["桂枝新加汤","桂枝附子汤","麻黄附子细辛汤","芍药甘草汤"],ans:0,exp:"桂枝新加汤，发汗后营血不足身痛脉沉迟。"},
{sub:"shanghan",q:"太阳病，发汗，遂漏不止，其人恶风，小便难，四肢微急，难以屈伸者，方？",opt:["桂枝汤","桂枝加附子汤","桂枝去芍药汤","桂枝去芍药加附子汤"],ans:1,exp:"桂枝加附子汤，过汗伤阳，漏汗不止。"},
{sub:"shanghan",q:"太阳病，下之后，脉促胸满者，何方？",opt:["桂枝去芍药汤","桂枝去芍药加附子汤","栀子豉汤","小陷胸汤"],ans:0,exp:"误下，胸阳受挫，去芍药之酸收。"},
{sub:"shanghan",q:"太阳病，下之后，脉促胸满而微恶寒者？",opt:["桂枝去芍药汤","桂枝去芍药加附子汤","桂枝附子汤","甘草附子汤"],ans:1,exp:"微恶寒是阳虚，加附子温胸阳。"},
{sub:"shanghan",q:"发汗后，不可更行桂枝汤，汗出而喘，无大热者，方？",opt:["麻杏石甘汤","桂枝加厚朴杏子汤","小青龙汤","葛根芩连汤"],ans:0,exp:"麻杏石甘汤，邪热壅肺，汗出喘，热不在表。"},
{sub:"shanghan",q:"太阳病，桂枝证，医反下之，利遂不止，脉促者，表未解也；喘而汗出者，方？",opt:["葛根芩连汤","黄芩汤","白头翁汤","黄连汤"],ans:0,exp:"葛根芩连，协热下利，表里俱热。"},
{sub:"shanghan",q:"伤寒表不解，心下有水气，干呕发热而咳，或渴或利，方？",opt:["小青龙汤","大青龙汤","苓桂术甘汤","真武汤"],ans:0,exp:"小青龙：外寒内饮，咳喘、干呕、痰多清稀。"},
{sub:"shanghan",q:"太阳中风，脉浮紧，发热恶寒，身疼痛，不汗出而烦躁者，方？",opt:["麻黄汤","大青龙汤","小青龙汤","麻杏石甘汤"],ans:1,exp:"大青龙：风寒表实兼里热，不汗出烦躁。"},
{sub:"shanghan",q:"伤寒六七日，发热，微恶寒，支节烦疼，微呕，心下支结，外证未去者，方？",opt:["柴胡桂枝汤","小柴胡汤","大柴胡汤","桂枝人参汤"],ans:0,exp:"柴胡桂枝，太阳少阳合病。"},
{sub:"shanghan",q:"伤寒五六日中风，往来寒热，胸胁苦满，默默不欲饮食，心烦喜呕，方？",opt:["小柴胡汤","大柴胡汤","柴胡加龙骨牡蛎汤","柴胡桂枝干姜汤"],ans:0,exp:"小柴胡，少阳本证四大主症。"},
{sub:"shanghan",q:"太阳病不解，热结膀胱，其人如狂，血自下，下者愈，方？",opt:["桃核承气汤","抵当汤","抵当丸","大黄牡丹汤"],ans:0,exp:"桃核承气，下焦蓄血轻证，如狂。"},
{sub:"shanghan",q:"伤寒有热，少腹满，应小便不利，今反利者，为有血也，当下之，方？",opt:["桃核承气汤","抵当汤","五苓散","猪苓汤"],ans:1,exp:"抵当汤，蓄血重证，少腹硬满，小便自利。"},
{sub:"shanghan",q:"太阳病，发汗后，大汗出，胃中干，烦躁不得眠，欲得饮水者，少少与饮之；若脉浮，小便不利，微热消渴者，方？",opt:["猪苓汤","五苓散","茯苓甘草汤","苓桂术甘汤"],ans:1,exp:"五苓散，太阳蓄水，水蓄膀胱，消渴小便不利。"},
{sub:"shanghan",q:"发汗后，脐下悸者，欲作奔豚，方？",opt:["茯苓桂枝甘草大枣汤","苓桂术甘汤","桂枝加桂汤","桂枝甘草汤"],ans:0,exp:"苓桂甘枣，下焦水饮，脐下悸欲奔豚。"},
{sub:"shanghan",q:"发汗过多，其人叉手自冒心，心下悸，欲得按者，方？",opt:["桂枝甘草汤","炙甘草汤","苓桂术甘汤","桂枝加桂汤"],ans:0,exp:"桂枝甘草，过汗心阳虚心悸。"},
{sub:"shanghan",q:"伤寒，脉浮，自汗出，小便数，心烦，微恶寒，脚挛急，误与桂枝汤之后，若厥逆，咽中干，烦躁吐逆，先予？",opt:["甘草干姜汤","芍药甘草汤","四逆汤","当归四逆汤"],ans:0,exp:"先复阳，甘草干姜；厥愈足温再给芍药甘草复阴缓挛急。"},
{sub:"shanghan",q:"若脚挛急，两胫拘急，宜？",opt:["甘草干姜汤","芍药甘草汤","四逆汤","理中汤"],ans:1,exp:"芍药甘草汤，酸甘化阴，缓急止挛。"},
{sub:"shanghan",q:"伤寒，胸中有热，胃中有邪气，腹中痛，欲呕吐者，方？",opt:["黄连汤","半夏泻心汤","干姜黄芩黄连人参汤","栀子干姜汤"],ans:0,exp:"黄连汤，上热下寒，腹痛欲呕。"},
{sub:"shanghan",q:"伤寒五六日，呕而发热者，柴胡汤证具，而以他药下之，心下但满而不痛者，方？",opt:["小陷胸汤","半夏泻心汤","大陷胸汤","生姜泻心汤"],ans:1,exp:"半夏泻心，寒热错杂痞，满而不痛。"},
{sub:"shanghan",q:"伤寒汗出解之后，胃中不和，心下痞硬，干噫食臭，胁下有水气，腹中雷鸣下利者，方？",opt:["半夏泻心汤","生姜泻心汤","甘草泻心汤","旋覆代赭汤"],ans:1,exp:"生姜泻心，水饮食滞痞，干噫食臭、雷鸣下利。"},
{sub:"shanghan",q:"伤寒中风，医反下之，其人下利日数十行，谷不化，腹中雷鸣，心下痞硬而满，干呕心烦不得安，方？",opt:["甘草泻心汤","生姜泻心汤","黄连汤","黄芩汤"],ans:0,exp:"甘草泻心，痞证兼胃气重虚，利甚谷不化。"},
{sub:"shanghan",q:"伤寒发汗，若吐若下，解后，心下痞硬，噫气不除者，方？",opt:["旋覆代赭汤","生姜泻心汤","厚朴生姜半夏甘草人参汤","吴茱萸汤"],ans:0,exp:"旋覆代赭，胃虚痰阻，噫气频作。"},
{sub:"shanghan",q:"发汗后，腹胀满者，方？",opt:["厚朴生姜半夏甘草人参汤","大承气汤","小承气汤","调胃承气汤"],ans:0,exp:"厚朴生姜半夏甘草人参，脾虚气滞腹胀。"},
{sub:"shanghan",q:"阳明病，不吐不下，心烦者，方？",opt:["调胃承气汤","小承气汤","大承气汤","栀子豉汤"],ans:0,exp:"调胃承气，阳明燥热，腑实初成，以心烦为主。"},
{sub:"shanghan",q:"阳明潮热，大便硬，腹大满不通，无潮热谵语重证，宜？",opt:["调胃承气","小承气","大承气","麻子仁丸"],ans:1,exp:"小承气，痞满实而燥坚较轻。"},
{sub:"shanghan",q:"阳明病，潮热，手足濈然汗出，大便硬，谵语，腹满痛，方？",opt:["大承气汤","小承气汤","调胃承气汤","大柴胡汤"],ans:0,exp:"大承气，痞满燥实四证俱全。"},
{sub:"shanghan",q:"趺阳脉浮而涩，浮则胃气强，涩则小便数，浮涩相搏，大便则硬，其脾为约，方？",opt:["麻子仁丸","五仁丸","蜜煎导","大承气汤"],ans:0,exp:"麻子仁丸，脾约证，胃强脾弱，小便数大便硬。"},
{sub:"shanghan",q:"阳明病，脉迟，汗出多，微恶寒者，表未解也，可发汗，宜？",opt:["麻黄汤","桂枝汤","葛根汤","桂枝加葛根汤"],ans:1,exp:"阳明兼太阳表证，有汗微恶寒，桂枝汤。"},
{sub:"shanghan",q:"少阳之为病，口苦，咽干，____也。",opt:["目眩","耳聋","胁痛","往来寒热"],ans:0,exp:"少阳提纲：口苦咽干目眩。"},
{sub:"shanghan",q:"伤寒，脉弦细，头痛发热者，属？",opt:["太阳","阳明","少阳","厥阴"],ans:2,exp:"脉弦细是少阳脉，不可发汗。"},
{sub:"shanghan",q:"太阴之为病，腹满而吐，食不下，自利益甚，时腹自痛，若下之，必____。",opt:["胸下结硬","烦躁","厥逆","发黄"],ans:0,exp:"太阴提纲，脾虚寒湿，误下则中阳更伤，结硬。"},
{sub:"shanghan",q:"自利不渴者，属太阴，以其藏有寒故也，当温之，宜服？",opt:["四逆汤","理中丸","附子汤","真武汤"],ans:1,exp:"理中（人参）汤，太阴寒湿自利不渴。"},
{sub:"shanghan",q:"少阴之为病，脉微细，____也。",opt:["但欲寐","恶寒","下利","厥逆"],ans:0,exp:"少阴提纲：脉微细，但欲寐。"},
{sub:"shanghan",q:"少阴病，始得之，反发热，脉沉者，方？",opt:["麻黄附子细辛汤","麻黄附子甘草汤","四逆汤","附子汤"],ans:0,exp:"少阴兼表，太少两感，初起发热脉沉。"},
{sub:"shanghan",q:"少阴病，得之二三日，麻黄附子甘草汤微发汗，原因是？",opt:["微邪在表，证轻","水饮内停","寒盛于里","阳脱"],ans:0,exp:"病程稍久，表邪轻微，用甘草缓温。"},
{sub:"shanghan",q:"少阴病，身体痛，手足寒，骨节痛，脉沉者，方？",opt:["附子汤","真武汤","四逆汤","当归四逆汤"],ans:0,exp:"附子汤，少阴阳虚寒湿，身痛骨节痛脉沉。"},
{sub:"shanghan",q:"少阴病，二三日不已，至四五日，腹痛，小便不利，四肢沉重疼痛，自下利者，此为有水气，方？",opt:["附子汤","真武汤","猪苓汤","五苓散"],ans:1,exp:"真武汤，少阴阳虚水泛。"},
{sub:"shanghan",q:"少阴病，下利，便脓血者，方？",opt:["桃花汤","白头翁汤","黄连阿胶汤","干姜黄芩黄连人参汤"],ans:0,exp:"桃花汤，虚寒便脓血，血色暗淡。"},
{sub:"shanghan",q:"少阴病，得之二三日以上，心中烦，不得卧，方？",opt:["黄连阿胶汤","栀子豉汤","猪苓汤","酸枣仁汤"],ans:0,exp:"黄连阿胶，少阴阴虚火旺，心烦不眠。"},
{sub:"shanghan",q:"少阴病，下利六七日，咳而呕渴，心烦不得眠者，方？",opt:["黄连阿胶汤","猪苓汤","真武汤","四逆散"],ans:1,exp:"猪苓汤，少阴阴虚水热互结。"},
{sub:"shanghan",q:"少阴病，四逆，其人或咳，或悸，或小便不利，或腹中痛，或泄利下重者，方？",opt:["四逆汤","四逆散","当归四逆汤","乌梅丸"],ans:1,exp:"四逆散，少阴阳郁致四逆，不是阳虚寒厥。"},
{sub:"shanghan",q:"厥阴之为病，消渴，气上撞心，心中疼热，饥而不欲食，食则吐蛔，下之利不止，代表方？",opt:["乌梅丸","当归四逆汤","吴茱萸汤","干姜黄芩黄连人参汤"],ans:0,exp:"乌梅丸，厥阴提纲主方，寒热错杂蛔厥。"},
{sub:"shanghan",q:"手足厥寒，脉细欲绝者，方？",opt:["四逆汤","当归四逆汤","当归四逆加吴茱萸生姜汤","乌梅丸"],ans:1,exp:"当归四逆，血虚寒厥，脉细。"},
{sub:"shanghan",q:"干呕，吐涎沫，头痛者，方？",opt:["吴茱萸汤","半夏干姜散","小半夏汤","四逆汤"],ans:0,exp:"吴茱萸汤，肝胃虚寒，浊阴上逆，巅顶头痛。"},
{sub:"shanghan",q:"伤寒，脉滑而厥者，里有热，宜？",opt:["白虎汤","四逆汤","当归四逆汤","白头翁汤"],ans:0,exp:"热厥，里热郁闭，脉滑，白虎清里热。"},
{sub:"shanghan",q:"太阳病，脉浮紧，发热，身无汗，自衄者，宜？",opt:["愈","麻黄汤","桂枝汤","大青龙汤"],ans:0,exp:"太阳伤寒，自衄，邪随衄解，可愈。"},
{sub:"shanghan",q:"太阳病，发热恶寒，热多寒少，脉微弱者，不可？",opt:["发汗","清里","攻下","利水"],ans:0,exp:"脉微弱，阳气虚，不可发汗。"},
{sub:"shanghan",q:"服桂枝汤，大汗出后，大烦渴不解，脉洪大者，方？",opt:["白虎加人参汤","白虎汤","桂枝汤","麻杏石甘汤"],ans:0,exp:"大汗伤津气，大烦渴，白虎加人参。"},
{sub:"shanghan",q:"伤寒，脉浮，发热无汗，其表不解，不可与？",opt:["白虎汤","麻黄汤","桂枝汤","葛根汤"],ans:0,exp:"表不解，无汗，禁用白虎，冰伏表邪。"},
{sub:"shanghan",q:"伤寒，心下有水气，咳而微喘，发热不渴，服汤已渴者，此？",opt:["寒去欲解","里热盛","津伤","水饮加重"],ans:0,exp:"服小青龙汤后口渴，寒饮渐化，欲解。"},
{sub:"shanghan",q:"太阳病，二日反躁，凡熨其背而大汗出，大热入胃，胃中水竭，躁烦，必发？",opt:["谵语","厥逆","惊狂","奔豚"],ans:0,exp:"火劫伤津，燥热入胃，发谵语。"},
{sub:"shanghan",q:"伤寒，火逆下之，因烧针烦躁者，方？",opt:["桂枝甘草龙骨牡蛎汤","桂枝去芍药加蜀漆牡蛎龙骨救逆汤","茯苓四逆汤","栀子豉汤"],ans:0,exp:"火逆，心神浮越烦躁，桂甘龙牡。"},
{sub:"shanghan",q:"伤寒脉浮，医以火迫劫之，亡阳，必惊狂，卧起不安者，方？",opt:["救逆汤","桂甘龙牡","茯苓四逆","桂枝加桂汤"],ans:0,exp:"亡阳惊狂，桂枝去芍药加蜀漆龙骨牡蛎救逆汤。"},
{sub:"shanghan",q:"烧针令其汗，针处被寒，核起而赤者，必发奔豚，方？",opt:["桂枝加桂汤","苓桂甘枣","桂枝甘草汤","茯苓甘草汤"],ans:0,exp:"针处受寒，奔豚，桂枝加桂，温通降冲。"},
{sub:"shanghan",q:"伤寒，发汗，若下之，病仍不解，烦躁者，方？",opt:["茯苓四逆汤","干姜附子汤","栀子豉汤","桂甘龙牡"],ans:0,exp:"汗下后阴阳两虚，烦躁，茯苓四逆。"},
{sub:"shanghan",q:"下之后，复发汗，昼日烦躁不得眠，夜而安静，不呕不渴，无表证，脉沉微，身无大热者，方？",opt:["干姜附子汤","茯苓四逆","四逆汤","桂枝甘草汤"],ans:0,exp:"单阳虚，昼烦夜静，干姜附子汤。"},
{sub:"shanghan",q:"发汗后，水药不得入口为逆，若更发汗，必吐下不止，此为？",opt:["胃虚气逆","少阳证","阳明腑实","水热互结"],ans:0,exp:"发汗伤胃气，胃失和降，水药不入。"},
{sub:"shanghan",q:"伤寒中风，有柴胡证，但见一证便是，不必悉具，指哪一经？",opt:["少阳","太阳","阳明","太阴"],ans:0,exp:"少阳柴胡证，但见一证便是，不必诸证齐全。"},
{sub:"shanghan",q:"凡柴胡汤病证而下之，若柴胡证不罢者，复与柴胡汤，必蒸蒸而振，却复发热汗出而解，名为？",opt:["战汗","自汗","盗汗","狂汗"],ans:0,exp:"正气驱邪，战汗而解。"},
{sub:"shanghan",q:"伤寒十余日，热结在里，复往来寒热者，方？",opt:["大柴胡汤","小柴胡汤","柴胡加芒硝汤","柴胡桂枝汤"],ans:0,exp:"少阳兼阳明腑实，大柴胡汤。"},
{sub:"shanghan",q:"伤寒十三日不解，胸胁满而呕，日晡所发潮热，已而微利，方？",opt:["柴胡加芒硝汤","大柴胡","小柴胡","桃核承气"],ans:0,exp:"少阳兼阳明里实，正气偏弱，柴胡加芒硝。"},
{sub:"shanghan",q:"伤寒八九日，下之，胸满烦惊，小便不利，谵语，一身尽重，不可转侧者，方？",opt:["柴胡加龙骨牡蛎汤","小柴胡","大柴胡","柴胡桂枝干姜汤"],ans:0,exp:"少阳，痰热扰神，柴胡加龙牡。"},
{sub:"shanghan",q:"伤寒，胸胁满微结，小便不利，渴而不呕，但头汗出，往来寒热，心烦者，方？",opt:["柴胡桂枝干姜汤","小柴胡","五苓散","猪苓汤"],ans:0,exp:"少阳兼水饮内结，柴胡桂枝干姜汤。"},
{sub:"shanghan",q:"太阳与阳明合病，不下利，但呕者，方？",opt:["葛根加半夏汤","葛根汤","黄芩汤","黄连汤"],ans:0,exp:"太阳阳明合病，呕而不利，葛根加半夏。"},
{sub:"shanghan",q:"太阳与少阳合病，自下利者，方？",opt:["黄芩汤","葛根芩连","白头翁汤","黄连汤"],ans:0,exp:"少阳热迫大肠，黄芩汤；呕加半夏。"},
{sub:"shanghan",q:"伤寒，本自寒下，医复吐下之，寒格，更逆吐下，若食入口即吐，方？",opt:["干姜黄芩黄连人参汤","黄连汤","半夏泻心","栀子干姜汤"],ans:0,exp:"上热下寒，寒格，食入即吐，干姜芩连人参汤。"},
{sub:"shanghan",q:"伤寒，医以丸药大下之，身热不去，微烦者，方？",opt:["栀子干姜汤","栀子豉汤","黄连汤","干姜黄芩黄连人参汤"],ans:0,exp:"上热下寒，栀子干姜。"},
{sub:"shanghan",q:"阳明病，其人喜忘者，必有？",opt:["蓄血","燥屎","水饮","寒湿"],ans:0,exp:"阳明蓄血，久瘀，其人喜忘。"},
{sub:"shanghan",q:"阳明病，发热汗出者，此为？",opt:["热越","瘀热","水停","寒湿"],ans:0,exp:"发热汗出，热有出路，为热越，不能发黄。"},
{sub:"shanghan",q:"阳明病，无汗，小便不利，心中懊憹者，必？",opt:["发黄","谵语","厥逆","发狂"],ans:0,exp:"湿热郁蒸，不得外泄，必发黄。"},
{sub:"shanghan",q:"阳明病，面合色赤，不可？",opt:["攻之","清之","和之","利之"],ans:0,exp:"面赤是郁热在经，禁攻下。"},
{sub:"shanghan",q:"阳明病，汗多而渴者，不可与？",opt:["猪苓汤","白虎汤","调胃承气","五苓散"],ans:0,exp:"汗多津伤，禁用猪苓汤再利小便。"},
{sub:"shanghan",q:"阳明病，脉迟，虽汗出不恶寒者，其身必重，短气，腹满而喘，有潮热者，此外欲解，可？",opt:["攻里","发汗","利水","清营"],ans:0,exp:"潮热，腑实已成，可攻。"},
{sub:"shanghan",q:"阳明病，谵语，有潮热，反不能食者，胃中必有？",opt:["燥屎","宿食","痰饮","瘀血"],ans:0,exp:"燥屎阻滞，腑气不通，不能食。"},
{sub:"shanghan",q:"三阳合病，腹满身重，难以转侧，口不仁，面垢，谵语遗尿，方？",opt:["白虎汤","大柴胡","葛根汤","大承气"],ans:0,exp:"三阳合病，邪热偏阳明气分，白虎汤。"},
{sub:"shanghan",q:"少阳病，欲已者，必？",opt:["蒸蒸而振","大汗出","下利","衄血"],ans:0,exp:"少阳邪退，战汗而解，蒸蒸而振。"},
{sub:"shanghan",q:"太阴病，脉浮者，可发汗，宜？",opt:["桂枝汤","麻黄汤","桂枝人参汤","葛根汤"],ans:0,exp:"太阴兼表，脉浮，桂枝汤。"},
{sub:"shanghan",q:"太阳病，外证未除，而数下之，遂协热而利，利下不止，心下痞硬，表里不解者，方？",opt:["桂枝人参汤","葛根芩连","理中汤","半夏泻心"],ans:0,exp:"脾虚寒兼表热，协热利，桂枝人参汤。"},
{sub:"shanghan",q:"少阴病，脉沉者，急温之，宜？",opt:["四逆汤","附子汤","真武汤","麻黄附子细辛汤"],ans:0,exp:"脉沉阳虚，急温，四逆汤。"},
{sub:"shanghan",q:"少阴病，下利清谷，里寒外热，手足厥逆，脉微欲绝，身反不恶寒，其人面色赤，方？",opt:["通脉四逆汤","四逆汤","白通汤","白通加猪胆汁汤"],ans:0,exp:"阴盛格阳，通脉四逆。"},
{sub:"shanghan",q:"少阴病，下利，脉微者，与白通汤。利不止，厥逆无脉，干呕烦者，方？",opt:["白通加猪胆汁汤","通脉四逆","四逆汤","真武汤"],ans:0,exp:"服白通后格拒，白通加猪胆汁。"},
{sub:"shanghan",q:"少阴病，吐利，手足逆冷，烦躁欲死者，方？",opt:["吴茱萸汤","四逆汤","通脉四逆","茯苓四逆"],ans:0,exp:"少阴寒邪犯胃，吴茱萸汤。"},
{sub:"shanghan",q:"少阴病，饮食入口则吐，心中温温欲吐，复不能吐，始得之，手足寒，脉弦迟者，此胸中实，不可下也，当？",opt:["吐之","温之","清之","利之"],ans:0,exp:"痰实在上，宜吐。"},
{sub:"shanghan",q:"厥阴病，热少厥微，指头寒，默默不欲食，烦躁，数日，小便利，色白者，此热除也，欲得食，其病为？",opt:["愈","进","传阳明","传少阳"],ans:0,exp:"热退，胃气恢复，欲食则愈。"},
{sub:"shanghan",q:"伤寒厥而心下悸，宜先治水，当服？",opt:["茯苓甘草汤","真武汤","苓桂术甘","五苓散"],ans:0,exp:"水饮停胃，厥悸，先治水，茯苓甘草汤。"},
{sub:"shanghan",q:"伤寒，先厥后发热而利者，必自止，见厥复利，提示？",opt:["阳气进退反复","阳复太过","纯阴无阳","热盛"],ans:0,exp:"厥为阳退，发热为阳复，厥利交替。"},
{sub:"shanghan",q:"下利，谵语者，有燥屎也，宜？",opt:["小承气汤","大承气","调胃承气","白头翁汤"],ans:0,exp:"阳明腑实，热结旁流，小承气。"},
{sub:"shanghan",q:"热利下重者，方？",opt:["白头翁汤","黄芩汤","葛根芩连","黄连汤"],ans:0,exp:"厥阴热利，里急后重，白头翁汤。"},
{sub:"shanghan",q:"呕而发热者，方？",opt:["小柴胡汤","黄芩汤","黄连汤","吴茱萸汤"],ans:0,exp:"呕而发热，少阳本证，小柴胡。"},
{sub:"shanghan",q:"伤寒，大吐大下之，极虚，复极汗者，其人外气怫郁，复与之水，以发其汗，因得哕，所以然者，胃中寒冷故也，宜？",opt:["理中丸","吴茱萸汤","四逆汤","旋覆代赭"],ans:0,exp:"胃阳虚寒，哕逆，理中温胃。"},
{sub:"shanghan",q:"伤寒，哕而腹满，视其前后，知何部不利，利之则愈，前后指？",opt:["二便","气血","表里","上下"],ans:0,exp:"看大便、小便是否不通。"},
{sub:"shanghan",q:"霍乱，头痛发热，身疼痛，热多欲饮水者，方？",opt:[
  // ========== 金匮要略 100题 ==========
{sub:"jinkui",q:"《金匮》见肝之病，知肝传脾，当先？",opt:["清肝","实脾","补肾","和胃"],ans:1,exp:"见肝之病，当先实脾，治未病思想。"},
{sub:"jinkui",q:"虚劳里急，悸，衄，腹中痛，梦失精，四肢酸疼，手足烦热，咽干口燥，方？",opt:["小建中汤","黄芪建中汤","桂枝加龙骨牡蛎汤","酸枣仁汤"],ans:0,exp:"小建中，阴阳两虚虚劳，里急腹痛，烦热失精。"},
{sub:"jinkui",q:"虚劳里急，诸不足，方？",opt:["小建中汤","黄芪建中汤","八味肾气丸","薯蓣丸"],ans:1,exp:"黄芪建中，小建中基础气虚更重，加黄芪。"},
{sub:"jinkui",q:"夫失精家，少腹弦急，阴头寒，目眩，发落，脉极虚芤迟，方？",opt:["桂枝加龙骨牡蛎汤","小建中","天雄散","酸枣仁汤"],ans:0,exp:"桂枝加龙牡，阴阳两虚失精、梦交。"},
{sub:"jinkui",q:"虚劳诸不足，风气百疾，方？",opt:["薯蓣丸","黄芪建中","八味肾气丸","大黄䗪虫丸"],ans:0,exp:"薯蓣丸，虚劳兼外感风气，扶正祛邪。"},
{sub:"jinkui",q:"虚劳腰痛，少腹拘急，小便不利者，方？",opt:["肾气丸","栝蒌瞿麦丸","五苓散","猪苓汤"],ans:0,exp:"八味肾气丸，肾气不足，腰痛小便不利。"},
{sub:"jinkui",q:"五劳虚极羸瘦，腹满不能饮食，食伤、忧伤、饮伤、房室伤、饥伤、劳伤、经络营卫气伤，内有干血，肌肤甲错，两目黯黑，方？",opt:["大黄䗪虫丸","下瘀血汤","桃核承气","抵当汤"],ans:0,exp:"大黄䗪虫丸，虚劳干血，缓中补虚。"},
{sub:"jinkui",q:"太阳病，其证备，身体强，几几然，脉反沉迟，此为痉，方？",opt:["栝蒌桂枝汤","葛根汤","大承气汤","桂枝汤"],ans:0,exp:"柔痉，太阳痉病，汗出，栝蒌桂枝。"},
{sub:"jinkui",q:"痉为病，胸满，口噤，卧不着席，脚挛急，必齘齿，方？",opt:["大承气汤","葛根汤","栝蒌桂枝汤","白虎汤"],ans:0,exp:"阳明热盛痉，急下存阴。"},
{sub:"jinkui",q:"湿家身烦疼，可与____发其汗为宜，慎不可以火攻之。",opt:["麻黄加术汤","麻杏薏甘汤","防己黄芪汤","甘草附子汤"],ans:0,exp:"麻黄加术，寒湿在表，身烦疼。"},
{sub:"jinkui",q:"病者一身尽疼，发热，日晡所剧者，名风湿，方？",opt:["麻黄加术汤","麻杏薏甘汤","防己黄芪汤","桂枝附子汤"],ans:1,exp:"麻杏薏甘，风湿在表，日晡发热加剧。"},
{sub:"jinkui",q:"风湿，脉浮身重，汗出恶风者，方？",opt:["防己黄芪汤","桂枝附子汤","白术附子汤","甘草附子汤"],ans:0,exp:"防己黄芪，风湿表虚，自汗身重。"},
{sub:"jinkui",q:"伤寒八九日，风湿相搏，身体疼烦，不能自转侧，不呕不渴，脉浮虚而涩者，方？",opt:["桂枝附子汤","白术附子汤","甘草附子汤","防己黄芪汤"],ans:0,exp:"桂枝附子，风湿，表阳虚。"},
{sub:"jinkui",q:"风湿相搏，骨节疼烦，掣痛不得屈伸，近之则痛剧，汗出短气，小便不利，恶风不欲去衣，或身微肿者，方？",opt:["桂枝附子汤","白术附子汤","甘草附子汤","麻杏薏甘汤"],ans:2,exp:"甘草附子，表里阳气俱虚风湿痹痛。"},
{sub:"jinkui",q:"百合病，百脉一宗，悉致其病也，意欲食复不能食，常默默，方？",opt:["百合地黄汤","百合知母汤","滑石代赭汤","百合鸡子黄汤"],ans:0,exp:"百合病主方百合地黄，阴虚内热。"},
{sub:"jinkui",q:"百合病，发汗后者，方？",opt:["百合知母汤","百合地黄","滑石代赭","百合鸡子黄"],ans:0,exp:"百合病误汗，伤津，百合知母。"},
{sub:"jinkui",q:"狐惑之为病，状如伤寒，默默欲眠，目不得闭，卧起不安，蚀于喉为惑，蚀于阴为狐，方？",opt:["甘草泻心汤","赤小豆当归散","苦参汤","雄黄熏法"],ans:0,exp:"狐惑病主方甘草泻心，湿热虫毒。"},
{sub:"jinkui",q:"阳毒之为病，面赤斑斑如锦纹，咽喉痛，唾脓血，方？",opt:["升麻鳖甲汤","赤小豆当归散","黄连解毒汤","犀角地黄汤"],ans:0,exp:"升麻鳖甲汤，阴阳毒。"},
{sub:"jinkui",q:"疟母，此结为癥瘕，名曰疟母，急治之，宜？",opt:["鳖甲煎丸","蜀漆散","白虎加桂枝汤","柴胡去半夏加栝蒌汤"],ans:0,exp:"鳖甲煎丸，久疟不愈，疟母结块。"},
{sub:"jinkui",q:"温疟者，其脉如平，身无寒但热，骨节疼烦，时呕，方？",opt:["白虎加桂枝汤","白虎汤","蜀漆散","鳖甲煎丸"],ans:0,exp:"温疟，里热兼表，无寒但热骨痛。"},
{sub:"jinkui",q:"中风，手足拘急，百脉一宗，悉致其病，邪在于络，____；邪在于经，____。",opt:["肌肤不仁，即重不胜","即重不胜，肌肤不仁","舌即难言，口吐涎","不识人"],ans:0,exp:"邪在络肌肤不仁；邪在经肢体重滞；邪入腑不识人；邪入脏舌难言。"},
{sub:"jinkui",q:"血痹，阴阳俱微，寸口关上微，尺中小紧，外证身体不仁，如风痹状，方？",opt:["黄芪桂枝五物汤","桂枝汤","当归四逆汤","防己黄芪汤"],ans:0,exp:"黄芪桂枝五物，血痹，气虚血滞肌肤麻木。"},
{sub:"jinkui",q:"胸痹之病，喘息咳唾，胸背痛，短气，寸口脉沉而迟，关上小紧数，方？",opt:["栝蒌薤白白酒汤","栝蒌薤白半夏汤","枳实薤白桂枝汤","人参汤"],ans:0,exp:"胸痹基础方栝蒌薤白白酒，胸背痛短气。"},
{sub:"jinkui",q:"胸痹，不得卧，心痛彻背者，方？",opt:["栝蒌薤白白酒汤","栝蒌薤白半夏汤","枳实薤白桂枝汤","乌头赤石脂丸"],ans:1,exp:"痰浊更重，不得卧，栝蒌薤白半夏汤。"},
{sub:"jinkui",q:"胸痹，心中痞气，气结在胸，胸满，胁下逆抢心，方？",opt:["枳实薤白桂枝汤","人参汤","栝蒌薤白半夏汤","茯苓杏仁甘草汤"],ans:0,exp:"枳实薤白桂枝，胸痹偏实证，胁下逆气上冲。"},
{sub:"jinkui",q:"胸痹，胸中气塞，短气，茯苓杏仁甘草汤主之；____亦主之。",opt:["橘枳姜汤","桂枝生姜枳实汤","人参汤","薏苡附子散"],ans:0,exp:"茯苓杏仁甘草偏饮；橘枳姜汤偏气滞。"},
{sub:"jinkui",q:"心痛彻背，背痛彻心，方？",opt:["乌头赤石脂丸","薏苡附子散","栝蒌薤白半夏汤","桂枝生姜枳实汤"],ans:0,exp:"乌头赤石脂丸，阴寒极盛，剧痛放射。"},
{sub:"jinkui",q:"腹满时减，复如故，此为寒，当与____。",opt:["温药","下法","清法","和法"],ans:0,exp:"虚寒腹满，时轻时重，温之。"},
{sub:"jinkui",q:"病腹满，发热十日，脉浮而数，饮食如故，方？",opt:["厚朴七物汤","厚朴三物汤","大柴胡汤","大承气汤"],ans:0,exp:"厚朴七物，太阳阳明合病腹满发热。"},
{sub:"jinkui",q:"痛而闭者，方？",opt:["厚朴三物汤","大承气汤","厚朴七物","小承气"],ans:0,exp:"厚朴三物，气滞里实，以胀为主。"},
{sub:"jinkui",q:"按之心下满痛者，此为实也，当下之，宜？",opt:["大柴胡汤","大承气汤","厚朴三物","厚朴七物"],ans:0,exp:"大柴胡，少阳阳明同病，心下满痛。"},
{sub:"jinkui",q:"寒疝腹中痛，逆冷，手足不仁，若身疼痛，灸刺诸药不能治，方？",opt:["乌头桂枝汤","大乌头煎","当归生姜羊肉汤","附子粳米汤"],ans:0,exp:"乌头桂枝，寒疝兼表寒。"},
{sub:"jinkui",q:"寒疝绕脐痛，若发则白汗出，手足厥冷，其脉沉紧者，方？",opt:["大乌头煎","乌头桂枝汤","当归生姜羊肉汤","附子粳米汤"],ans:0,exp:"大乌头煎，阴寒剧痛，寒疝重证。"},
{sub:"jinkui",q:"产后腹中㽲痛，当归生姜羊肉汤主之，并治腹中寒疝，____。",opt:["虚劳不足","瘀血腹痛","气滞腹痛","水饮腹痛"],ans:0,exp:"当归生姜羊肉，血虚寒痛，温补养血散寒。"},
{sub:"jinkui",q:"妇人怀妊，腹中㽲痛，方？",opt:["当归芍药散","胶艾汤","桂枝茯苓丸","枳实芍药散"],ans:0,exp:"当归芍药散，妊娠肝脾不和，腹中绵绵痛。"},
{sub:"jinkui",q:"妇人有漏下者，有半产后因续下血都不绝者，有妊娠下血者，方？",opt:["胶艾汤","当归芍药散","桂枝茯苓丸","芎归胶艾汤即胶艾汤"],ans:0,exp:"胶艾汤，冲任虚损下血，养血止血安胎。"},
{sub:"jinkui",q:"妇人宿有癥病，经断未及三月，而得漏下不止，胎动在脐上者，为癥痼害，方？",opt:["桂枝茯苓丸","胶艾汤","当归芍药散","枳实芍药散"],ans:0,exp:"桂枝茯苓，癥积瘀血，化瘀消癥，缓攻。"},
{sub:"jinkui",q:"产后腹痛，烦满不得卧，方？",opt:["枳实芍药散","下瘀血汤","当归生姜羊肉汤","当归芍药散"],ans:0,exp:"枳实芍药，产后气滞血郁腹痛烦满。"},
{sub:"jinkui",q:"产妇腹痛，法当以枳实芍药散，假令不愈者，此为腹中有干血着脐下，宜？",opt:["下瘀血汤","大黄䗪虫丸","桃核承气","抵当汤"],ans:0,exp:"下瘀血汤，产后干血，脐下腹痛。"},
{sub:"jinkui",q:"问曰：妇人年五十所，病下利数十日不止，暮即发热，少腹里急，腹满，手掌烦热，唇口干燥，方？",opt:["温经汤","胶艾汤","当归芍药散","桂枝茯苓丸"],ans:0,exp:"温经汤，冲任虚寒兼瘀血，崩漏、暮热。"},
{sub:"jinkui",q:"消渴，小便多，饮一斗，小便一斗，方？",opt:["肾气丸","五苓散","猪苓汤","栝蒌瞿麦丸"],ans:0,exp:"肾气丸，下消，肾阳不足。"},
{sub:"jinkui",q:"小便不利者，有水气，其人苦渴，方？",opt:["栝蒌瞿麦丸","肾气丸","猪苓汤","五苓散"],ans:0,exp:"栝蒌瞿麦，上燥下寒，水停小便不利而渴。"},
{sub:"jinkui",q:"淋之为病，小便如粟状，小腹弦急，痛引脐中，病机？",opt:["湿热结下焦","肾阳不足","阴虚水热互结","气滞"],ans:0,exp:"淋病，湿热煎熬，尿如粟，茎中痛。"},
{sub:"jinkui",q:"水气病，脉沉，面目身体四肢浮肿，其脉自浮者，为？",opt:["风水","皮水","正水","石水"],ans:0,exp:"风水：脉浮，恶风，水肿；皮水脉浮不恶风。"},
{sub:"jinkui",q:"皮水其脉亦浮，外证胕肿，按之没指，不恶风，其腹如鼓，不渴，当发其汗，方？",opt:["防己茯苓汤","越婢加术汤","甘草麻黄汤","麻黄附子汤"],ans:0,exp:"防己茯苓，皮水，脾虚水泛四肢肿。"},
{sub:"jinkui",q:"风水恶风，一身悉肿，脉浮不渴，续自汗出，无大热，方？",opt:["越婢汤","越婢加术汤","防己黄芪汤","甘草麻黄汤"],ans:0,exp:"越婢汤，风水夹热。"},
{sub:"jinkui",q:"黄疸，谷疸之为病，寒热不食，食即头眩，心胸不安，久久发黄，方？",opt:["茵陈蒿汤","栀子大黄汤","硝石矾石散","茵陈五苓散"],ans:0,exp:"谷疸，湿热在脾胃，茵陈蒿汤。"},
{sub:"jinkui",q:"酒黄疸，心中懊憹或热痛，方？",opt:["栀子大黄汤","茵陈蒿汤","大黄硝石汤","硝石矾石散"],ans:0,exp:"酒疸，湿热偏上，心中懊憹热痛。"},
{sub:"jinkui",q:"黄疸病，茵陈五苓散适合哪一类？",opt:["湿重于热","热重于湿","湿热俱重","寒湿阴黄"],ans:0,exp:"茵陈五苓，利湿清热，湿重于热黄疸。"},
{sub:"jinkui",q:"诸呕吐，谷不得下者，方？",opt:["小半夏汤","大半夏汤","半夏干姜散","生姜半夏汤"],ans:0,exp:"小半夏汤，痰饮呕吐基础方。"},
{sub:"jinkui",q:"《金匮》上工治未病，中工？",opt:["治已病","治未传","治其标","治其本"],ans:0,exp:"上工治未病，中工治已病。"},
{sub:"jinkui",q:"夫男子平人，脉大为？",opt:["劳","实","热","痰"],ans:0,exp:"男子平人，脉大为劳，极虚亦为劳。"},
{sub:"jinkui",q:"痉病，其脉？",opt:["紧","浮","沉","迟"],ans:0,exp:"痉，脉紧。"},
{sub:"jinkui",q:"太阳中暍，发热恶寒，身重而疼痛，其脉弦细芤迟，方？",opt:["白虎加人参汤","新加香薷饮","三石汤","清暑益气汤"],ans:0,exp:"中暍，暑热伤气津，白虎加人参。"},
{sub:"jinkui",q:"太阳中暍，身热疼重，而脉微弱，此以夏月伤冷水，水行皮中所致也，方？",opt:["一物瓜蒂汤","白虎加人参","香薷散","三仁汤"],ans:0,exp:"暑夹水湿，一物瓜蒂汤。"},
{sub:"jinkui",q:"百合病，见于阴者，以阳法救之；见于阳者，以阴法救之，见阳攻阴，复发其汗，此为？",opt:["逆","顺","和","平"],ans:0,exp:"百合病阴阳俱虚，误攻为逆。"},
{sub:"jinkui",q:"狐惑，蚀于上部则声喝，方？",opt:["甘草泻心汤","苦参汤","雄黄熏","赤小豆当归散"],ans:0,exp:"蚀于喉上部，甘草泻心；蚀于下用苦参汤外洗。"},
{sub:"jinkui",q:"病者脉数，无热，微烦，默默但欲卧，汗出，初得之三四日，目赤如鸠眼，七八日，目四眦黑，若能食者，脓已成也，方？",opt:["赤小豆当归散","升麻鳖甲汤","甘草泻心","薏苡附子败酱散"],ans:0,exp:"阴阳毒、内痈脓成，赤小豆当归散排脓。"},
{sub:"jinkui",q:"疟，脉自弦，弦数者多？",opt:["热","寒","虚","湿"],ans:0,exp:"弦数多热，弦迟多寒。"},
{sub:"jinkui",q:"疟多寒者，名曰牝疟，方？",opt:["蜀漆散","白虎加桂枝汤","鳖甲煎丸","柴胡去半夏加栝蒌汤"],ans:0,exp:"牝疟，寒多热少，蜀漆散。"},
{sub:"jinkui",q:"中风，邪入于腑，即？",opt:["不识人","肌肤不仁","舌难言","肢重不胜"],ans:0,exp:"邪在络肌肤不仁；经即重不胜；腑不识人；脏舌难言。"},
{sub:"jinkui",q:"中风，邪入于脏，即？",opt:["舌即难言，口吐涎","不识人","肌肤不仁","身重"],ans:0,exp:"邪入脏，舌难言，口吐涎。"},
{sub:"jinkui",q:"历节病，不可屈伸，疼痛，方？",opt:["乌头汤","桂枝芍药知母汤","甘草附子汤","白虎加桂枝汤"],ans:0,exp:"寒湿历节剧痛，乌头汤。"},
{sub:"jinkui",q:"诸肢节疼痛，身体尪羸，脚肿如脱，头眩短气，温温欲吐，方？",opt:["桂枝芍药知母汤","乌头汤","甘草附子","白虎加桂枝"],ans:0,exp:"风湿化热，历节，桂枝芍药知母汤。"},
{sub:"jinkui",q:"胸痹，胸中痞，胁下逆抢心，偏虚用人参汤，其病机是？",opt:["中阳不振","痰浊壅盛","气滞血瘀","水饮"],ans:0,exp:"人参汤（理中），虚寒胸痹。"},
{sub:"jinkui",q:"心中痞，诸逆心悬痛，方？",opt:["桂枝生姜枳实汤","乌头赤石脂丸","栝蒌薤白半夏汤","橘枳姜汤"],ans:0,exp:"寒饮上逆，心悬痛，桂枝生姜枳实汤。"},
{sub:"jinkui",q:"腹满，口舌干燥，此肠间有水气，方？",opt:["己椒苈黄丸","甘遂半夏汤","十枣汤","五苓散"],ans:0,exp:"肠间水饮，己椒苈黄丸，前后分消。"},
{sub:"jinkui",q:"病者脉伏，其人欲自利，利反快，虽利，心下续坚满，此为留饮欲去故也，方？",opt:["甘遂半夏汤","己椒苈黄","十枣汤","木防己汤"],ans:0,exp:"留饮，自利反快，甘遂半夏汤。"},
{sub:"jinkui",q:"膈间支饮，其人喘满，心下痞坚，面色黧黑，其脉沉紧，得之数十日，医吐下之不愈，方？",opt:["木防己汤","木防己去石膏加茯苓芒硝汤","十枣汤","葶苈大枣泻肺汤"],ans:0,exp:"支饮夹热，木防己汤。"},
{sub:"jinkui",q:"支饮不得息，方？",opt:["葶苈大枣泻肺汤","小青龙汤","苓甘五味姜辛汤","十枣汤"],ans:0,exp:"支饮壅肺，喘急不得息，葶苈大枣泻肺汤。"},
{sub:"jinkui",q:"咳逆倚息不得卧，小青龙汤主之；服后多唾口燥，寸脉沉，尺脉微，手足厥逆，气从小腹上冲胸咽，方？",opt:["苓桂五味甘草汤","苓甘五味姜辛汤","苓甘五味加姜辛半夏杏仁汤","苓甘五味加姜辛半杏大黄汤"],ans:0,exp:"冲气上逆，苓桂五味甘草汤平冲。"},
{sub:"jinkui",q:"冲气即低，而反更咳，胸满者，方？",opt:["苓甘五味姜辛汤","苓桂五味甘草","小青龙","十枣汤"],ans:0,exp:"冲平，寒饮复动而咳满，苓甘五味姜辛。"},
{sub:"jinkui",q:"先渴后呕，为水停心下，此属饮家，方？",opt:["小半夏加茯苓汤","小半夏汤","五苓散","猪苓汤"],ans:0,exp:"水饮兼眩悸，小半夏加茯苓。"},
{sub:"jinkui",q:"呕家本渴，渴者为欲解，今反不渴，心下有支饮故也，方？",opt:["小半夏汤","小半夏加茯苓","泽泻汤","猪苓散"],ans:0,exp:"支饮呕而不渴，小半夏汤。"},
{sub:"jinkui",q:"心下有支饮，其人苦冒眩，方？",opt:["泽泻汤","苓桂术甘汤","小半夏加茯苓","五苓散"],ans:0,exp:"支饮上蒙清阳，冒眩，泽泻汤。"},
{sub:"jinkui",q:"小便不利者，蒲灰散主之，病机？",opt:["湿热瘀结膀胱","肾阳不足","水热互结","脾虚水停"],ans:0,exp:"蒲灰散化瘀清热利小便。"},
{sub:"jinkui",q:"风水，脉浮，身重，汗出恶风者，防己黄芪汤，其病机？",opt:["表虚风湿","风水夹热","皮水脾虚","正水阳虚"],ans:0,exp:"卫气不固，风湿在表。"},
{sub:"jinkui",q:"里水，越婢加术汤主之，里水指？",opt:["皮水","风水","正水","石水"],ans:0,exp:"里水即皮水，一身面目黄肿。"},
{sub:"jinkui",q:"正水，其脉沉迟，外证？",opt:["自喘","恶风","不渴","腹满无喘"],ans:0,exp:"正水，肾阳虚水停，脉沉迟，自喘。"},
{sub:"jinkui",q:"石水，其脉自沉，外证？",opt:["腹满不喘","喘","恶风","身热"],ans:0,exp:"石水，水结下焦，腹满不喘。"},
{sub:"jinkui",q:"黄汗之为病，身体肿，发热汗出而渴，状如风水，汗沾衣，色正黄如柏汁，脉自沉，方？",opt:["黄芪芍桂苦酒汤","桂枝加黄芪汤","越婢汤","防己黄芪汤"],ans:0,exp:"黄汗，湿热郁滞营卫，黄芪芍桂苦酒汤。"},
{sub:"jinkui",q:"诸黄，腹痛而呕者，宜？",opt:["柴胡汤","茵陈蒿汤","栀子大黄汤","硝石矾石散"],ans:0,exp:"黄疸兼少阳，腹痛呕，柴胡。"},
{sub:"jinkui",q:"黄疸，病在女劳，额上黑，微汗出，手足中热，薄暮即发，膀胱急，小便自利，方？",opt:["硝石矾石散","茵陈蒿汤","栀子大黄汤","大黄硝石汤"],ans:0,exp:"女劳疸，肾虚夹瘀，硝石矾石散。"},
{sub:"jinkui",q:"黄疸，腹满，小便不利而赤，自汗出，此为表和里实，当下之，方？",opt:["大黄硝石汤","茵陈蒿汤","栀子大黄汤","硝石矾石散"],ans:0,exp:"黄疸热盛腑实，大黄硝石汤。"},
{sub:"jinkui",q:"呕吐，哕，下利，病皆属于？",opt:["脾胃","肝胆","肺肾","三焦"],ans:0,exp:"呕哕利，病位核心在脾胃。"},
{sub:"jinkui",q:"干呕，吐逆，吐涎沫，方？",opt:["半夏干姜散","小半夏汤","生姜半夏汤","吴茱萸汤"],ans:0,exp:"中阳不足，寒饮上逆，半夏干姜散。"},
{sub:"jinkui",q:"病人胸中似喘不喘，似呕不呕，似哕不哕，彻心中愦愦然无奈者，方？",opt:["生姜半夏汤","半夏干姜散","小半夏汤","旋覆代赭汤"],ans:0,exp:"寒饮扰胸，气机郁滞，生姜半夏汤。"},
{sub:"jinkui",q:"哕逆者，方？",opt:["橘皮竹茹汤","橘皮汤","旋覆代赭","吴茱萸汤"],ans:0,exp:"胃虚有热，哕逆，橘皮竹茹汤。"},
{sub:"jinkui",q:"干呕，哕，若手足厥者，方？",opt:["橘皮汤","橘皮竹茹汤","四逆汤","吴茱萸汤"],ans:0,exp:"胃寒气闭，哕而厥，橘皮汤通胃阳。"},
{sub:"jinkui",q:"下利，脉沉而迟，其人面少赤，身有微热，下利清谷者，必郁冒汗出而解，为何？",opt:["阳气渐复","阳盛","阴盛","邪热外透"],ans:0,exp:"戴阳轻症，阳气恢复，郁冒汗解。"},
{sub:"jinkui",q:"下利清谷，里寒外热，汗出而厥者，方？",opt:["通脉四逆汤","四逆汤","白通汤","附子汤"],ans:0,exp:"阴盛格阳重证，通脉四逆。"},
{sub:"jinkui",q:"气利，诃梨勒散主之，气利是？",opt:["矢气随利而出","气滞便秘","里急后重","腹胀嗳气"],ans:0,exp:"气虚滑脱，矢气与粪便同出，叫气利。"},
{sub:"jinkui",q:"妇人妊娠，宜常服当归散，适合哪种体质？",opt:["血虚湿热","阳虚寒盛","纯虚寒","瘀血"],ans:0,exp:"当归散养血清热，血虚有湿热胎动不安。"},
{sub:"jinkui",q:"妊娠养胎，白术散主之，适合？",opt:["脾虚寒湿","血虚湿热","血热","瘀阻"],ans:0,exp:"白术散健脾除湿，安胎，脾虚寒湿。"},
{sub:"jinkui",q:"产后风，续之数十日不解，头微痛，恶寒，时时有热，心下闷，干呕，汗出，方？",opt:["竹叶汤","桂枝汤","柴胡桂枝汤","小柴胡汤"],ans:0,exp:"产后阳虚外感，竹叶汤，扶正解表。"},
{sub:"jinkui",q:"妇人乳中虚，烦乱呕逆，安中益气，方？",opt:["竹皮大丸","橘皮竹茹汤","麦门冬汤","温经汤"],ans:0,exp:"产后乳虚，虚热上扰，竹皮大丸。"},
{sub:"jinkui",q:"带下，经水不利，少腹满痛，经一月再见者，方？",opt:["土瓜根散","桂枝茯苓丸","温经汤","当归芍药散"],ans:0,exp:"瘀血经水不利，土瓜根散。"},
{sub:"jinkui",q:"妇人阴寒，温阴中坐药，方？",opt:["蛇床子散","矾石丸","狼牙汤","苦参汤"],ans:0,exp:"寒湿阴冷，蛇床子散坐药。"},
{sub:"jinkui",q:"少阴脉滑而数者，阴中即生疮，阴中蚀疮烂者，方？",opt:["狼牙汤","蛇床子散","矾石丸","苦参汤"],ans:0,exp:"湿热蚀疮，狼牙汤外洗。"},
{sub:"jinkui",q:"问曰：妇人病，饮食如故，烦热不得卧，而反倚息者，何也？师曰：此名转胞，方？",opt:["肾气丸","五苓散","猪苓汤","栝蒌瞿麦丸"],ans:0,exp:"肾虚气化不利，胞系了戾，转胞，肾气丸。"},
  // ========== 温病 110题 ==========
{sub:"wenbing",q:"叶天士《外感温热篇》：温邪上受，首先犯____，逆传____。",opt:["肺，心包","卫，营","肺，胃","上焦，中焦"],ans:0,exp:"温病总纲：温邪上受，首先犯肺，逆传心包。"},
{sub:"wenbing",q:"叶天士：在卫____，到气____，入营____，入血____。",opt:["汗之可也，才可清气，犹可透热转气，直须凉血散血","清气，透营，凉血，散血","发汗，攻下，清营，止血","辛凉，苦寒，咸寒，酸寒"],ans:0,exp:"卫气营血治法纲领。"},
{sub:"wenbing",q:"叶天士，舌绛而干，为？",opt:["热入营分","热入血分","卫分热盛","气分热盛"],ans:0,exp:"舌绛提示营分热；舌深绛紫暗为血分。"},
{sub:"wenbing",q:"吴鞠通《温病条辨》提出三焦辨证，上焦病位主要是？",opt:["肺与心包","脾胃","肝肾","胆与大肠"],ans:0,exp:"上焦：肺、心包；中焦：脾胃；下焦：肝肾。"},
{sub:"wenbing",q:"吴鞠通，太阴风温、温热、温疫、冬温，初起恶风寒者，____主之；但热不恶寒而渴者，____主之。",opt:["桂枝汤，银翘散","银翘散，桑菊饮","桂枝汤，白虎汤","桑菊饮，银翘散"],ans:0,exp:"温病初起，有风寒表证暂用桂枝；纯温热用银翘散。"},
{sub:"wenbing",q:"太阴风温，但咳，身不甚热，微渴者，何方？",opt:["银翘散","桑菊饮","麻杏石甘汤","白虎汤"],ans:1,exp:"桑菊饮，辛凉轻剂，以咳嗽为主，热轻。"},
{sub:"wenbing",q:"太阴温病，脉浮洪，舌黄，渴甚，大汗，面赤，恶热，方？",opt:["白虎汤","银翘散","桑菊饮","麻杏石甘汤"],ans:0,exp:"辛凉重剂白虎汤，气分大热四大证。"},
{sub:"wenbing",q:"太阳温病，发汗而汗不出，发疹，宜？",opt:["银翘散去豆豉加细生地丹皮大青叶倍玄参方","化斑汤","清营汤","犀角地黄汤"],ans:0,exp:"银翘散加减，透疹凉营。"},
{sub:"wenbing",q:"太阴温病，气血两燔，方？",opt:["化斑汤","清营汤","犀角地黄汤","玉女煎"],ans:0,exp:"化斑汤，白虎加犀角玄参，气血两燔发斑。"},
{sub:"wenbing",q:"邪入心包，舌蹇肢厥，宜？",opt:["安宫牛黄丸","紫雪丹","至宝丹","清宫汤"],ans:0,exp:"安宫牛黄：清热开窍，解毒，高热神昏为主。"},
{sub:"wenbing",q:"热邪内陷心包，神昏而痉厥抽搐，宜？",opt:["安宫牛黄丸","紫雪丹","至宝丹","清宫汤"],ans:1,exp:"紫雪丹长于息风止痉。"},
{sub:"wenbing",q:"秽浊较重，神昏，痰盛，宜？",opt:["安宫牛黄丸","紫雪丹","至宝丹","清宫汤"],ans:2,exp:"至宝丹偏芳香辟秽化痰开窍。"},
{sub:"wenbing",q:"阳明温病，脉浮而促者，方？",opt:["银翘散","白虎汤","栀子豉汤","三石汤"],ans:0,exp:"脉浮促，表热未尽，仍宜透表。"},
{sub:"wenbing",q:"阳明温病，无上焦证，数日不大便，当下之，若其人阴素虚，不可行承气者，方？",opt:["增液汤","增液承气汤","宣白承气","牛黄承气"],ans:0,exp:"增液汤：增水行舟，无水舟停，单纯阴亏不便。"},
{sub:"wenbing",q:"阳明温病，下之不通，喘促不宁，痰涎壅滞，右寸实大，肺气不降，方？",opt:["宣白承气汤","牛黄承气","增液承气","导赤承气"],ans:0,exp:"宣白承气：肺肠同病，肺热腑实。"},
{sub:"wenbing",q:"阳明温病，下之不通，神昏舌短，内窍不通，饮不解渴，方？",opt:["牛黄承气汤","宣白承气","增液承气","导赤承气"],ans:0,exp:"牛黄承气：心包热闭+阳明腑实。"},
{sub:"wenbing",q:"阳明温病，下之不通，小便赤痛，时烦渴甚，方？",opt:["导赤承气汤","牛黄承气","宣白承气","新加黄龙"],ans:0,exp:"导赤承气：小肠热盛兼腑实。"},
{sub:"wenbing",q:"阳明温病，下之不通，正虚邪实，方？",opt:["新加黄龙汤","增液承气","宣白承气","牛黄承气"],ans:0,exp:"新加黄龙，气阴两虚+腑实，扶正攻下。"},
{sub:"wenbing",q:"阳明暑温，脉滑数，不食不饥不便，浊痰凝聚，心下痞者，方？",opt:["小陷胸加枳实汤","半夏泻心汤","三仁汤","黄连温胆汤"],ans:0,exp:"痰热结胸，小陷胸加枳实。"},
{sub:"wenbing",q:"湿温初起，头痛恶寒，身重疼痛，舌白不渴，脉弦细而濡，面色淡黄，胸闷不饥，午后身热，状若阴虚，病难速已，方？",opt:["三仁汤","藿朴夏苓汤","黄芩滑石汤","甘露消毒丹"],ans:0,exp:"三仁汤，湿温初起，湿重于热。"},
{sub:"wenbing",q:"湿温，发热身痛，汗出热解，继而复热，舌淡黄而滑，脉缓，方？",opt:["黄芩滑石汤","三仁汤","甘露消毒丹","连朴饮"],ans:0,exp:"黄芩滑石汤，湿热并重，胶结不解。"},
{sub:"wenbing",q:"湿热蕴毒，发热倦怠，胸闷腹胀，肢酸咽痛，身目发黄，颐肿口渴，小便短赤，方？",opt:["甘露消毒丹","连朴饮","茵陈蒿汤","三仁汤"],ans:0,exp:"甘露消毒丹，湿热毒邪弥漫三焦。"},
{sub:"wenbing",q:"湿热霍乱，上吐下泻，胸脘痞闷，心烦躁扰，口渴不欲多饮，方？",opt:["连朴饮","蚕矢汤","藿香正气散","黄芩滑石汤"],ans:0,exp:"连朴饮，湿热并重，霍乱吐利。"},
{sub:"wenbing",q:"湿热内蕴，霍乱吐泻，腹痛转筋，方？",opt:["连朴饮","蚕矢汤","甘露消毒丹","三仁汤"],ans:1,exp:"蚕矢汤，湿热霍乱，转筋（筋失濡养）。"},
{sub:"wenbing",q:"伏暑，头痛微恶寒，面赤烦渴，舌白，脉濡而数，虽在秋冬，往往发汗，方？",opt:["银翘散","桑菊饮","银翘散去牛蒡元参加杏仁滑石方","新加香薷饮"],ans:2,exp:"伏暑，表里同病，湿温类，透表清暑湿。"},
{sub:"wenbing",q:"暑温初起，形似伤寒，右脉洪大而数，左脉反小于右，口渴甚，面赤，汗大出，方？",opt:["白虎汤","新加香薷饮","清暑益气汤","三石汤"],ans:0,exp:"暑入阳明，白虎汤。"},
{sub:"wenbing",q:"暑湿蔓延三焦，舌滑微黄，邪在气分者，方？",opt:["三石汤","白虎加苍术汤","新加香薷饮","清营汤"],ans:0,exp:"三石汤，暑湿弥漫三焦。"},
{sub:"wenbing",q:"暑温，汗出，身热，烦渴，脉虚，方？",opt:["白虎加人参汤","清暑益气汤","生脉散","三石汤"],ans:0,exp:"暑热耗气，白虎加人参。"},
{sub:"wenbing",q:"小儿暑温，暑邪深入厥阴，舌绛，神昏，痉厥，方？",opt:["羚角钩藤汤","清营汤","安宫牛黄丸","紫雪丹"],ans:0,exp:"羚角钩藤，凉肝息风，暑热动风。"},
{sub:"wenbing",q:"夏月乘凉饮冷，外感于寒，内伤于湿，恶寒发热，无汗，头痛身重，胸闷，方？",opt:["新加香薷饮","香薷散","藿香正气散","三仁汤"],ans:0,exp:"新加香薷饮，暑湿兼寒，辛温复辛凉法。"},
{sub:"wenbing",q:"下焦温病，热深厥甚，脉细促，心中憺憺大动，甚则心中痛者，方？",opt:["三甲复脉汤","大定风珠","小定风珠","加减复脉汤"],ans:0,exp:"三甲复脉，阴虚阳亢，脉细促，心悸动。"},
{sub:"wenbing",q:"热邪久羁，吸烁真阴，神倦瘛疭，脉气虚弱，舌绛苔少，时时欲脱，方？",opt:["大定风珠","三甲复脉","加减复脉","小定风珠"],ans:0,exp:"大定风珠，阴虚动风，欲脱重证。"},
{sub:"wenbing",q:"温病后期，夜热早凉，热退无汗，舌红少苔，脉细数，方？",opt:["青蒿鳖甲汤","清骨散","加减复脉汤","秦艽鳖甲散"],ans:0,exp:"青蒿鳖甲，邪伏阴分。"},
{sub:"wenbing",q:"吴鞠通，温病后期，邪少虚多，脉虚大，手足心热甚于手足背，方？",opt:["加减复脉汤","青蒿鳖甲汤","三甲复脉","大定风珠"],ans:0,exp:"加减复脉，肝肾阴虚，脉虚大，阴虚内热。"},
{sub:"wenbing",q:"烂喉痧，喉烂，丹痧密布，壮热口渴，舌红绛，脉细数，方？",opt:["凉营清气汤","余氏清心凉膈散","锡类散","珠黄散"],ans:0,exp:"凉营清气，烂喉痧气营两燔。"},
{sub:"wenbing",q:"大头瘟，头面红肿焮痛，目不能开，咽喉不利，舌燥口渴，方？",opt:["普济消毒饮","银翘散","黄连解毒汤","凉膈散"],ans:0,exp:"普济消毒饮，风热疫毒上攻大头瘟。"},
{sub:"wenbing",q:"温疫，湿热疫毒，憎寒壮热，舌红苔白厚如积粉，方？",opt:["达原饮","白虎汤","黄连解毒汤","清瘟败毒饮"],ans:0,exp:"达原饮，邪伏膜原，苔白如积粉。"},
{sub:"wenbing",q:"温疫热毒，气血两燔，大热渴饮，头痛如劈，干呕狂躁，谵语神昏，方？",opt:["清瘟败毒饮","化斑汤","白虎汤","犀角地黄汤"],ans:0,exp:"清瘟败毒，气血两燔重证，瘟疫。"},
{sub:"wenbing",q:"薛生白《湿热病篇》，湿热证，始恶寒，后但热不寒，汗出胸痞，舌白，口渴不引饮，病机是？",opt:["湿热阻遏卫气","湿热入营","湿热入血","阳明热盛"],ans:0,exp:"湿热初起，卫气同病，湿重于热。"},
{sub:"wenbing",q:"薛生白：湿热证，寒热如疟，湿热阻遏膜原，宜？",opt:["柴胡厚朴汤","达原饮","三仁汤","黄芩滑石汤"],ans:0,exp:"湿热阻膜原，柴胡厚朴汤，区别于达原饮之疫毒。"},
{sub:"wenbing",q:"薛生白：湿热证，数日后，汗出热不除，或痉，忽头痛不止者，营液大亏，风火上升，宜？",opt:["羚羊角、蔓荆、钩藤、生地等","羚角钩藤汤","大定风珠","三甲复脉"],ans:0,exp:"湿热伤阴，风阳上冒头痛痉。"},
{sub:"wenbing",q:"陈平伯《外感温病篇》，风温为病，春月与冬季居多，或恶风，或不恶风，必身热，咳嗽，烦渴，病位在？",opt:["肺胃","卫营","上焦心包","肝胆"],ans:0,exp:"风温，肺胃热盛为主。"},
{sub:"wenbing",q:"余师愚论疫，认为疫疹的根本病机是？",opt:["胃热","肺热","心包热","肝胆热"],ans:0,exp:"余氏疫疹，以胃热为本，石膏为核心药。"},
{sub:"wenbing",q:"温病中，斑和疹鉴别，斑出自____，疹出自____。",opt:["血络，卫分","气分，血络","营分，气分","肺，胃"],ans:0,exp:"斑：肌肉血络；疹：肺卫。斑宜清化，疹宜透发。"},
{sub:"wenbing",q:"斑的治法禁忌，哪一项错误？",opt:["提透","清火","凉血","散血"],ans:0,exp:"斑忌辛温提透，容易动血加重出血。"},
{sub:"wenbing",q:"舌绛而有黄苔，说明？",opt:["营分热，气分未尽","纯营分热","血分热","卫气同病"],ans:0,exp:"绛舌为营，夹黄苔，气营两燔，气分之邪未罢。"},
{sub:"wenbing",q:"舌紫暗而润，多见于？",opt:["寒凝血瘀","热盛血瘀","阴虚","湿热"],ans:0,exp:"紫暗湿润是寒瘀；紫绛干枯为热瘀。"},

// 记忆存储：每道题独立状态 {choose, rate, showAns}
let memory = JSON.parse(localStorage.getItem("tcmQuizMem")) || {};
let filterSubject = "all";
let wrongOnly = false;
let currentIdx = 0;
let renderPool = [];

// 元素
const totalEl = document.getElementById("total");
const doneEl = document.getElementById("done");
const masterEl = document.getElementById("master");
const filterTip = document.getElementById("filterTip");
const qWrap = document.getElementById("qWrap");
const qIndexEl = document.getElementById("qIndex");
const subjectTag = document.getElementById("subjectTag");
const qText = document.getElementById("qText");
const optWrap = document.getElementById("optWrap");
const ansWrap = document.getElementById("ansWrap");
const ansText = document.getElementById("ansText");
const wrongBtn = document.getElementById("wrongBtn");
const resetBtn = document.getElementById("resetBtn");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const showAnsBtn = document.getElementById("showAnsBtn");
const tabs = document.querySelectorAll(".tab");
const rateBtns = document.querySelectorAll(".rate-btn");

// 科目名字映射
const subName = {
  neijing:"内经",
  shanghan:"伤寒论",
  jinkui:"金匮要略",
  wenbing:"温病条辨"
};

// 更新统计面板
function updateStat(){
  let done=0,master=0;
  questionList.forEach((item,i)=>{
    const rec = memory[i];
    if(rec && rec.choose!==null){
      done++;
      if(rec.rate===3) master++;
    }
  })
  totalEl.innerText = questionList.length;
  doneEl.innerText = done;
  masterEl.innerText = master;
  localStorage.setItem("tcmQuizMem",JSON.stringify(memory));
}

// 生成刷题池（筛选）
function makePool(){
  renderPool = questionList.map((v,i)=>({...v,idx:i}));
  if(filterSubject!=="all") renderPool = renderPool.filter(x=>x.sub===filterSubject);
  if(wrongOnly) renderPool = renderPool.filter(x=>{
    const r = memory[x.idx];
    return r && r.choose!==null && r.rate < 3;
  })
}

// 渲染当前题目：读取该题自己的全部状态
function render(){
  if(renderPool.length===0){
    qWrap.style.display="none";
    filterTip.innerText="当前筛选下没有题目";
    return;
  }
  qWrap.style.display="block";
  filterTip.innerText = wrongOnly?"模式：只看错题":"模式：正常刷题";
  const cur = renderPool[currentIdx];
  subjectTag.innerText = subName[cur.sub];
  qIndexEl.innerText = `${currentIdx+1}/${renderPool.length}`;
  qText.innerText = cur.q;
  optWrap.innerHTML = "";
  ansText.innerText = cur.exp;

  // 不存在记录就初始化一条
  if(!memory[cur.idx]){
    memory[cur.idx] = {choose:null, rate:2, showAns:false};
  }
  const rec = memory[cur.idx];
  let answered = rec.choose !== null;

  // 解析显示状态跟随本题
  ansWrap.classList.toggle("show", rec.showAns);

  cur.opt.forEach((txt,oi)=>{
    const div = document.createElement("div");
    div.className = "opt";
    div.innerText = txt;
    if(answered){
      if(oi === cur.ans) div.classList.add("right");
      else if(oi === rec.choose) div.classList.add("wrong");
      div.classList.add("disabled");
    }
    div.onclick = ()=>{
      if(answered) return;
      rec.choose = oi;
      memory[cur.idx] = rec;
      updateStat();
      render();
    }
    optWrap.appendChild(div);
  })

  // 标记按钮高亮
  rateBtns.forEach(b=>{
    b.classList.remove("active");
    if(Number(b.dataset.rate) === rec.rate){
      b.classList.add("active");
    }
  })
}

// 切换科目tab
tabs.forEach(t=>{
  t.onclick = ()=>{
    tabs.forEach(x=>x.classList.remove("active"));
    t.classList.add("active");
    filterSubject = t.dataset.subject;
    wrongOnly = false;
    currentIdx = 0;
    makePool();
    render();
  }
})

// 记忆评级按钮
rateBtns.forEach(b=>{
  b.onclick = ()=>{
    if(renderPool.length===0) return;
    const cur = renderPool[currentIdx];
    const r = Number(b.dataset.rate);
    if(!memory[cur.idx]) memory[cur.idx] = {choose:null, rate:2, showAns:false};
    memory[cur.idx].rate = r;
    updateStat();
    render();
  }
})

// 查看解析：只修改这一题自己的showAns
showAnsBtn.onclick = ()=>{
  const cur = renderPool[currentIdx];
  memory[cur.idx].showAns = !memory[cur.idx].showAns;
  updateStat();
  render();
}

// 只看错题
wrongBtn.onclick = ()=>{
  wrongOnly = !wrongOnly;
  currentIdx = 0;
  makePool();
  render();
}

// 重置本套（当前筛选池里面所有题目清空状态）
resetBtn.onclick = ()=>{
  if(confirm("确定清空当前这一套筛选内所有题目的作答记录？不可恢复！")){
    renderPool.forEach(x=>{
      memory[x.idx] = {choose:null, rate:2, showAns:false};
    })
    updateStat();
    makePool();
    render();
  }
}

prevBtn.onclick = ()=>{
  if(currentIdx>0){currentIdx--;render();}
}
nextBtn.onclick = ()=>{
  if(currentIdx < renderPool.length-1){currentIdx++;render();}
}

// 初始化
updateStat();
makePool();
render();
</script>
</body>
</html>
