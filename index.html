<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中医经典等级考试刷题</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, sans-serif;
        }
        body {
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
            background: #f7f8fa;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .stat {
            background: #fff;
            padding:12px 16px;
            border-radius:10px;
            margin-bottom:16px;
        }
        .card {
            background: #fff;
            border-radius:12px;
            padding:20px;
            box-shadow: 0 2px 8px #00000012;
        }
        .q-title {
            font-size:18px;
            margin-bottom:20px;
            line-height:1.6;
        }
        .option-item {
            border:1px solid #ddd;
            border-radius:8px;
            padding:14px;
            margin-bottom:10px;
            cursor:pointer;
        }
        .option-item:hover {
            border-color:#6688ff;
        }
        .right {
            background:#e6f9ed;
            border-color:#27ae60;
        }
        .wrong {
            background:#ffe9e9;
            border-color:#e74c3c;
        }
        .btn-group {
            display:flex;
            gap:10px;
            margin-top:24px;
        }
        button {
            flex:1;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:16px;
            cursor:pointer;
        }
        #prevBtn, #nextBtn {
            background:#3478f6;
            color:white;
        }
        #resetBtn {
            background:#888;
            color:white;
        }
    </style>
</head>
<body>
    <div class="header">
        <h2>中医经典等级刷题</h2>
        <div id="pageInfo">1 / 5</div>
    </div>
    <div class="stat">
        ✅ 答对：<span id="ok">0</span> &nbsp;&nbsp;
        ❌ 答错：<span id="no">0</span> &nbsp;&nbsp;
        📊 正确率：<span id="rate">0%</span>
    </div>
    <div class="card">
        <div class="q-title" id="question"></div>
        <div id="optionBox"></div>
        <div class="btn-group">
            <button id="prevBtn">上一题</button>
            <button id="nextBtn">下一题</button>
            <button id="resetBtn">重置</button>
        </div>
    </div>

<script>
// 中医经典等级考题库，内经/伤寒/金匮/温病，后续直接在这里增删
const questionList = [
    {
        q: "《素问·上古天真论》中，女子二七的生理变化是？",
        opt: ["任脉通，太冲脉盛，月事以时下","肾气盛，齿更发长","任脉虚，太冲脉衰少","筋骨坚，发长极"],
        ans: 0
    },
    {
        q: "伤寒论中，太阳病，头痛发热，身疼腰痛，骨节疼痛，恶风，无汗而喘者，宜用何方？",
        opt: ["桂枝汤","麻黄汤","葛根汤","大青龙汤"],
        ans: 1
    },
    {
        q: "《金匮要略》提出“见肝之病，知肝传脾”，当先？",
        opt: ["清肝","实脾","补肾","润肺"],
        ans: 1
    },
    {
        q: "叶天士《外感温热篇》提出，温病卫气营血传变，在卫应？",
        opt: ["透热转气","汗之","凉血散血","清气生津"],
        ans: 1
    },
    {
        q: "《灵枢·本神》：随神往来者谓之？",
        opt: ["魂","魄","意","志"],
        ans: 0
    }
];

let current = 0;
let okCount = 0;
let noCount = 0;
let answered = Array(questionList.length).fill(null);

const qEl = document.getElementById("question");
const optBox = document.getElementById("optionBox");
const pageInfo = document.getElementById("pageInfo");
const okEl = document.getElementById("ok");
const noEl = document.getElementById("no");
const rateEl = document.getElementById("rate");
const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");
const resetBtn = document.getElementById("resetBtn");

function render() {
    const item = questionList[current];
    pageInfo.innerText = `${current+1} / ${questionList.length}`;
    qEl.innerText = item.q;
    optBox.innerHTML = "";

    item.opt.forEach((txt,idx)=>{
        const div = document.createElement("div");
        div.className = "option-item";
        div.innerText = txt;
        if(answered[current] !== null){
            if(idx === item.ans) div.classList.add("right");
            else if(idx === answered[current]) div.classList.add("wrong");
        }
        div.onclick = ()=>{
            if(answered[current]!==null) return;
            answered[current] = idx;
            if(idx === item.ans) okCount++;
            else noCount++;
            updateStat();
            render();
        }
        optBox.appendChild(div);
    })
}
function updateStat(){
    okEl.innerText = okCount;
    noEl.innerText = noCount;
    const total = okCount + noCount;
    const r = total>0 ? (okCount/total*100).toFixed(1) : 0;
    rateEl.innerText = r + "%";
}

prevBtn.onclick = ()=>{
    if(current>0) { current--; render(); }
}
nextBtn.onclick = ()=>{
    if(current < questionList.length-1) { current++; render(); }
}
resetBtn.onclick = ()=>{
    current = 0;
    okCount = 0;
    noCount = 0;
    answered = Array(questionList.length).fill(null);
    updateStat();
    render();
}
render();
updateStat();
</script>
</body>
</html>
