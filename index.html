<script>
const qList=[
{q:"《素问·上古天真论》女子二七的生理表现为？",opt:["A.肾气盛，齿更发长","B.天癸至，任脉通，太冲脉盛，月事以时下","C.肾气平均，真牙生而长极","D.筋骨坚，发长极"],ans:"B",exp:"二七而天癸至，任脉通，太冲脉盛，月事以时下，故有子。"},
{q:"《素问·上古天真论》男子二八的生理是？",opt:["A.肾气盛，齿更发长","B.肾气盛，天癸至，精气溢泻","C.肾气平均，筋骨劲强","D.肾气实，发长齿更"],ans:"B",exp:"二八肾气盛，天癸至，精气溢泻，阴阳和，故能有子。"},
{q:"《素问·上古天真论》女子三七生理为？",opt:["A.肾气盛，齿更发长","B.任脉通，月事以时下","C.肾气平均，真牙生而长极","D.筋骨懈堕，天癸竭"],ans:"C",exp:"三七肾气平均，故真牙生而长极。"},
{q:"《素问·上古天真论》女子四七的生理是？",opt:["A.身体盛壮","B.筋骨坚，发长极，身体盛壮","C.阳明脉衰，面始焦","D.肾气衰，发堕齿槁"],ans:"B",exp:"四七筋骨坚，发长极，身体盛壮。"},
{q:"《素问·上古天真论》女子五七始衰的根本是？",opt:["A.肾气衰","B.阳明脉衰","C.天癸竭","D.太冲脉衰"],ans:"B",exp:"五七阳明脉衰，面始焦，发始堕。"},
{q:"《素问·上古天真论》男子三八生理为？",opt:["A.肾气盛，精气溢泻","B.肾气平均，筋骨劲强","C.肌肉满壮","D.肾气实，发长齿更"],ans:"B",exp:"三八肾气平均，筋骨劲强，故真牙生而长极。"},
{q:"《素问·上古天真论》男子四八生理为？",opt:["A.筋骨隆盛，肌肉满壮","B.肾气平均，筋骨劲强","C.肾气衰，发堕齿槁","D.阳气衰于上"],ans:"A",exp:"四八筋骨隆盛，肌肉满壮。"},
{q:"《素问·上古天真论》男子五八始衰在于？",opt:["A.肾气衰，发堕齿槁","B.阳明脉衰","C.天癸竭","D.肝气衰"],ans:"A",exp:"五八肾气衰，发堕齿槁。"},
{q:"《素问·上古天真论》上古之人，其知道者，养生关键是？",opt:["A.以酒为浆，以妄为常","B.法于阴阳，和于术数","C.起居无节","D.务快其心"],ans:"B",exp:"上古之人，其知道者，法于阴阳，和于术数。"},
{q:"《素问·上古天真论》‘恬淡虚无’的下一句是？",opt:["A.真气从之","B.精神内守","C.病安从来","D.顺应四时"],ans:"A",exp:"恬淡虚无，真气从之，精神内守，病安从来。"},
{q:"《素问·上古天真论》‘精神内守’的下一句？",opt:["A.真气从之","B.病安从来","C.度百岁乃去","D.和于阴阳"],ans:"B",exp:"恬淡虚无，真气从之，精神内守，病安从来。"},
{q:"《素问·四气调神大论》春三月的养生原则是？",opt:["A.养长","B.养收","C.养生","D.养藏"],ans:"C",exp:"春三月，此谓发陈，养生之道也。"},
{q:"《素问·四气调神大论》夏三月养生原则？",opt:["A.养生","B.养长","C.养收","D.养藏"],ans:"B",exp:"夏三月，此谓蕃秀，养长之道也。"},
{q:"《素问·四气调神大论》秋三月养生原则？",opt:["A.养生","B.养长","C.养收","D.养藏"],ans:"C",exp:"秋三月，此谓容平，养收之道也。"},
{q:"《素问·四气调神大论》冬三月养生原则？",opt:["A.养生","B.养长","C.养收","D.养藏"],ans:"D",exp:"冬三月，此谓闭藏，养藏之道也。"},
{q:"《素问·四气调神大论》春逆春气，则首先伤哪脏？",opt:["A.心","B.肝","C.脾","D.肺"],ans:"B",exp:"逆春气，则少阳不生，肝气内变。"},
{q:"《素问·四气调神大论》逆夏气，损伤何脏？",opt:["A.肝","B.心","C.肺","D.肾"],ans:"B",exp:"逆夏气，则太阳不长，心气内洞。"},
{q:"《素问·四气调神大论》逆秋气，损伤何脏？",opt:["A.心","B.脾","C.肺","D.肾"],ans:"C",exp:"逆秋气，则太阴不收，肺气焦满。"},
{q:"《素问·四气调神大论》逆冬气，损伤何脏？",opt:["A.肝","B.脾","C.肺","D.肾"],ans:"D",exp:"逆冬气，则少阴不藏，肾气独沉。"},
{q:"《素问·四气调神大论》四季养生的根本目的是？",opt:["A.顺应四时，调摄阴阳","B.补益气血","C.强壮筋骨","D.避其邪气"],ans:"A",exp:"四时阴阳者，万物之根本也。"},
{q:"《素问·阴阳应象大论》‘阴平阳秘’的结果是？",opt:["A.百病乃生","B.精神乃治","C.阴阳离决","D.精气乃绝"],ans:"B",exp:"阴平阳秘，精神乃治；阴阳离决，精气乃绝。"},
{q:"《素问·阴阳应象大论》阴阳的基本属性，‘水为阴，火为阳’，其中阴的特性是？",opt:["A.动、热、明","B.静、寒、晦","C.升、散","D.温、通"],ans:"B",exp:"阴静阳躁，阳生阴长，阳杀阴藏。"},
{q:"《素问·阴阳应象大论》‘阳生阴长，阳杀阴藏’说明阴阳具有？",opt:["A.对立制约","B.互根互用","C.消长平衡","D.相互转化"],ans:"B",exp:"体现阴阳互根、依存、同生同灭。"},
{q:"《素问·阴阳应象大论》‘寒极生热，热极生寒’属于？",opt:["A.对立制约","B.互根互用","C.消长平衡","D.相互转化"],ans:"D",exp:"极则转化，寒热互变。"},
{q:"《素问·阴阳应象大论》清气、浊气升降规律正确的是？",opt:["A.清气在下，浊气在上","B.清气在上，浊气在下","C.清气出上窍，浊气出下窍","D.清气降，浊气升"],ans:"C",exp:"清阳出上窍，浊阴出下窍。"},
{q:"《素问·阴阳应象大论》清阳的走向？",opt:["A.出上窍、发腠理、实四肢","B.出下窍、走五脏","C.归六腑","D.注骨髓"],ans:"A",exp:"清阳出上窍，浊阴出下窍；清阳发腠理，浊阴走五脏；清阳实四肢，浊阴归六腑。"},
{q:"《素问·阴阳应象大论》浊阴的走向？",opt:["A.发腠理","B.实四肢","C.走五脏、归六腑、出下窍","D.出上窍"],ans:"C",exp:"浊阴出下窍、走五脏、归六腑。"},
{q:"《素问·阴阳应象大论》‘壮水之主，以制阳光’适用于？",opt:["A.实热证","B.虚热证","C.实寒证","D.虚寒证"],ans:"B",exp:"阴虚则热，壮水制阳，治虚热。"},
{q:"《素问·阴阳应象大论》‘益火之源，以消阴翳’适用于？",opt:["A.实寒","B.虚寒","C.实热","D.虚热"],ans:"B",exp:"阳虚则寒，益火消阴，治虚寒。"},
{q:"《素问·阴阳应象大论》风邪的特性是？",opt:["A.湿胜则濡泻","B.风胜则动","C.热胜则肿","D.寒胜则浮"],ans:"B",exp:"风胜则动，热胜则肿，燥胜则干，寒胜则浮，湿胜则濡泻。"},
{q:"《素问·阴阳应象大论》热胜则？",opt:["A.动","B.肿","C.干","D.浮"],ans:"B",exp:"热胜则肿。"},
{q:"《素问·阴阳应象大论》燥胜则？",opt:["A.动","B.肿","C.干","D.濡泻"],ans:"C",exp:"燥胜则干。"},
{q:"《素问·阴阳应象大论》寒胜则？",opt:["A.浮","B.干","C.动","D.泄"],ans:"A",exp:"寒胜则浮。"},
{q:"《素问·阴阳应象大论》湿胜则？",opt:["A.浮","B.濡泻","C.肿","D.痛"],ans:"B",exp:"湿胜则濡泻。"},
{q:"《素问·灵兰秘典论》心的职能是？",opt:["A.君主之官，神明出焉","B.相傅之官，治节出焉","C.将军之官，谋虑出焉","D.中正之官，决断出焉"],ans:"A",exp:"心者，君主之官也，神明出焉。"},
{q:"《素问·灵兰秘典论》肺为？",opt:["A.君主之官","B.相傅之官","C.将军之官","D.仓廪之官"],ans:"B",exp:"肺者，相傅之官，治节出焉。"},
{q:"《素问·灵兰秘典论》肝为？",opt:["A.将军之官","B.中正之官","C.臣使之官","D.传道之官"],ans:"A",exp:"肝者，将军之官，谋虑出焉。"},
{q:"《素问·灵兰秘典论》胆为？",opt:["A.将军之官","B.中正之官","C.相傅之官","D.州都之官"],ans:"B",exp:"胆者，中正之官，决断出焉。"},
{q:"《素问·灵兰秘典论》膻中为？",opt:["A.臣使之官，喜乐出焉","B.传道之官","C.受盛之官","D.决渎之官"],ans:"A",exp:"膻中者，臣使之官，喜乐出焉。"},
{q:"《素问·灵兰秘典论》脾胃为？",opt:["A.仓廪之官，五味出焉","B.传道之官","C.化物之官","D.州都之官"],ans:"A",exp:"脾胃者，仓廪之官，五味出焉。"},
{q:"《素问·灵兰秘典论》大肠为？",opt:["A.传道之官，变化出焉","B.受盛之官","C.决渎之官","D.化物之官"],ans:"A",exp:"大肠者，传道之官，变化出焉。"},
{q:"《素问·灵兰秘典论》小肠为？",opt:["A.传道之官","B.受盛之官，化物出焉","C.决渎之官","D.州都之官"],ans:"B",exp:"小肠者，受盛之官，化物出焉。"},
{q:"《素问·灵兰秘典论》三焦为？",opt:["A.决渎之官，水道出焉","B.州都之官","C.传道之官","D.中正之官"],ans:"A",exp:"三焦者，决渎之官，水道出焉。"},
{q:"《素问·灵兰秘典论》膀胱为？",opt:["A.决渎之官","B.州都之官，津液藏焉","C.传道之官","D.臣使之官"],ans:"B",exp:"膀胱者，州都之官，津液藏焉，气化则能出矣。"},
{q:"《素问·五脏生成》心之合、其华分别为？",opt:["A.合脉，其华在面","B.合皮，其华在毛","C.合筋，其华在爪","D.合骨，其华在发"],ans:"A",exp:"心合脉，其华在面；肺合皮，其华在毛；肝合筋，其华在爪；脾合肉，其华在唇；肾合骨，其华在发。"},
{q:"《素问·五脏生成》肺之合、其华？",opt:["A.合脉，华在面","B.合皮，华在毛","C.合筋，华在爪","D.合肉，华在唇"],ans:"B",exp:"肺合皮，其华在毛。"},
{q:"《素问·五脏生成》肝之合、其华？",opt:["A.合筋，华在爪","B.合骨，华在发","C.合肉，华在唇","D.合脉，华在面"],ans:"A",exp:"肝合筋，其华在爪。"},
{q:"《素问·五脏生成》脾之合、其华？",opt:["A.合肉，华在唇","B.合皮，华在毛","C.合骨，华在发","D.合筋，华在爪"],ans:"A",exp:"脾合肉，其华在唇四白。"},
{q:"《素问·五脏生成》肾之合、其华？",opt:["A.合骨，华在发","B.合筋，华在爪","C.合脉，华在面","D.合肉，华在唇"],ans:"A",exp:"肾合骨，其华在发。"},
{q:"《素问·脉要精微论》诊法常以什么时候为佳？",opt:["A.日中","B.平旦","C.黄昏","D.夜半"],ans:"B",exp:"诊法常以平旦，阴气未动，阳气未散，饮食未进。"},
{q:"《素问·脉要精微论》‘长则气治’，短则？",opt:["A.气病","B.气高","C.气衰","D.气少"],ans:"D",exp:"长则气治，短则气少，数则烦心，大则病进。"},
{q:"《素问·脉要精微论》脉数主？",opt:["A.气衰","B.烦心","C.气弛","D.气困"],ans:"B",exp:"长则气治，短则气少，数则烦心。"},
{q:"《素问·脉要精微论》脉大提示？",opt:["A.病退","B.病进","C.气平","D.气和"],ans:"B",exp:"大则病进。"},
{q:"《素问·汤液醪醴论》‘去菀陈莝’主要针对？",opt:["A.水肿病","B.咳嗽","C.痹证","D.痿证"],ans:"A",exp:"平治于权衡，去菀陈莝，微动四极，温衣，缪刺其处，以复其形，针对水肿。"},
{q:"《素问·汤液醪醴论》水肿的病机关键是？",opt:["A.五脏阳已竭","B.风寒外束","C.湿邪浸淫","D.气滞水停"],ans:"A",exp:"其有不从毫毛而生，五脏阳以竭也。"},
{q:"《素问·生气通天论》阳气者，若天与？",opt:["A.日","B.月","C.星辰","D.四时"],ans:"A",exp:"阳气者，若天与日，失其所则折寿而不彰。"},
{q:"《素问·生气通天论》阳强不能密，则？",opt:["A.精神乃治","B.阴气乃绝","C.阴阳自和","D.病安从来"],ans:"B",exp:"凡阴阳之要，阳密乃固……阳强不能密，阴气乃绝。"},
{q:"《素问·生气通天论》汗出偏沮，使人？",opt:["A.偏枯","B.痿厥","C.痤疿","D.大疔"],ans:"A",exp:"汗出偏沮，使人偏枯。"},
{q:"《素问·生气通天论》膏粱厚味，足生？",opt:["A.大丁（疔）","B.痤疿","C.偏枯","D.瘘疮"],ans:"A",exp:"高梁之变，足生大丁。"},
{q:"《素问·生气通天论》劳汗当风，寒薄为？",opt:["A.痤","B.疿","C.皶","D.疔"],ans:"C",exp:"劳汗当风，寒薄为皶，郁乃痤。"},
{q:"《素问·生气通天论》‘阴之五宫，伤在五味’，五宫指？",opt:["A.五官","B.五脏","C.五体","D.五脉"],ans:"B",exp:"阴之五宫，伤在五味，五宫即五脏。"},
{q:"《素问·生气通天论》味过于酸，肝气以津，脾气乃？",opt:["A.绝","B.收","C.散","D.耗"],ans:"A",exp:"味过于酸，肝气以津，脾气乃绝。"},
{q:"《素问·生气通天论》味过于咸，大骨气劳，短肌，心气？",opt:["A.抑","B.收","C.散","D.竭"],ans:"A",exp:"味过于咸，大骨气劳，短肌，心气抑。"},
{q:"《素问·生气通天论》味过于甘，心气喘满，色黑，肾气？",opt:["A.不平","B.耗","C.收","D.散"],ans:"A",exp:"味过于甘，心气喘满，色黑，肾气不衡。"},
{q:"《素问·生气通天论》味过于苦，脾气不濡，胃气乃？",opt:["A.厚","B.薄","C.燥","D.缓"],ans:"A",exp:"味过于苦，脾气不濡，胃气乃厚。"},
{q:"《素问·生气通天论》味过于辛，筋脉沮弛，精神乃？",opt:["A.央（殃）","B.耗","C.闭","D.浮"],ans:"A",exp:"味过于辛，筋脉沮弛，精神乃央。"},
{q:"《素问·脉解》‘所谓胸痛少气者，水气在脏腑也’，属于哪经？",opt:["A.太阳","B.阳明","C.少阴","D.厥阴"],ans:"C",exp:"少阴脉解条文，水气上犯故胸痛少气。"},
{q:"《素问·标本病传论》先病而后逆者，治其？",opt:["A.本","B.标","C.标本同治","D.随证"],ans:"A",exp:"先病而后逆者治其本，先逆而后病者治其本。"},
{q:"《素问·标本病传论》先热而后生中满者，治其？",opt:["A.标","B.本","C.标本同取","D.不必治"],ans:"A",exp:"先热而后生中满者治其标，中满为急。"},
{q:"《素问·标本病传论》小大不利，治其？",opt:["A.标","B.本","C.缓图其本","D.先扶正"],ans:"A",exp:"小大不利治其标，二便不通为急症。"},
{q:"《素问·五常政大论》大毒治病，十去其？",opt:["A.六","B.七","C.八","D.九"],ans:"A",exp:"大毒治病，十去其六；常毒治病，十去其七；小毒治病，十去其八；无毒治病，十去其九。"},
{q:"《素问·五常政大论》常毒治病，十去其？",opt:["A.六","B.七","C.八","D.九"],ans:"B",exp:"常毒治病，十去其七。"},
{q:"《素问·五常政大论》小毒治病，十去其？",opt:["A.六","B.七","C.八","D.九"],ans:"C",exp:"小毒治病，十去其八。"},
{q:"《素问·五常政大论》无毒治病，十去其？",opt:["A.六","B.七","C.八","D.九"],ans:"D",exp:"无毒治病，十去其九，谷肉果菜，食养尽之。"},
{q:"《素问·六元正纪大论》‘有故无殒，亦无殒也’，是说？",opt:["A.妊娠有病，当治其病，药不伤胎","B.久病不治，正气自复","C.虚证宜补，不可攻伐","D.外感宜汗，不可早下"],ans:"A",exp:"妊娠而有大积大聚，有病则病当之，药不伤胎。"},
{q:"《素问·刺热》肝热病者，面色先见？",opt:["A.青","B.赤","C.黄","D.白"],ans:"A",exp:"肝热病者，左颊先赤；心热病者，颜先赤；脾热病者，鼻先赤；肺热病者，右颊先赤；肾热病者，颐先赤。"},
{q:"《素问·刺热》心热病，何处先赤？",opt:["A.左颊","B.颜（额）","C.鼻","D.右颊"],ans:"B",exp:"心热病者，颜先赤。"},
{q:"《素问·刺热》脾热病，何处先赤？",opt:["A.颐","B.鼻","C.右颊","D.额"],ans:"B",exp:"脾热病者，鼻先赤。"},
{q:"《素问·刺热》肺热病，何处先赤？",opt:["A.右颊","B.左颊","C.颐","D.鼻"],ans:"A",exp:"肺热病者，右颊先赤。"},
{q:"《素问·刺热》肾热病，何处先赤？",opt:["A.颐","B.额","C.鼻","D.左颊"],ans:"A",exp:"肾热病者，颐先赤。"},
{q:"《灵枢·决气》‘上焦开发，宣五谷味，熏肤、充身、泽毛，若雾露之溉’指？",opt:["A.气","B.精","C.津","D.液"],ans:"A",exp:"此所受气者，上焦开发……是谓气。"},
{q:"《灵枢·决气》两神相搏，合而成形，常先身生，是谓？",opt:["A.精","B.气","C.血","D.脉"],ans:"A",exp:"两神相搏，合而成形，常先身生，是谓精。"},
{q:"《灵枢·决气》中焦受气取汁，变化而赤，是谓？",opt:["A.血","B.津","C.液","D.精"],ans:"A",exp:"中焦受气取汁，变化而赤，是谓血。"},
{q:"《灵枢·决气》腠理发泄，汗出溱溱，是谓？",opt:["A.津","B.液","C.气","D.血"],ans:"A",exp:"腠理发泄，汗出溱溱，是谓津。"},
{q:"《灵枢·决气》谷入气满，淖泽注于骨，骨属屈伸，泄泽补益脑髓，皮肤润泽，是谓？",opt:["A.液","B.津","C.血","D.精"],ans:"A",exp:"谷入气满，淖泽注于骨……是谓液。"},
{q:"《灵枢·本输》六腑之阳，皆属于？",opt:["A.足阳明胃","B.手阳明大肠","C.足少阳胆","D.手少阳三焦"],ans:"A",exp:"六腑皆出足之三阳，上合于手者也，六腑阳经皆以阳明为本。"},
{q:"《灵枢·海论》脑为？",opt:["A.髓海","B.气海","C.血海","D.水谷之海"],ans:"A",exp:"脑为髓海，冲脉为血海，膻中为气海，胃为水谷之海。"},
{q:"《灵枢·海论》膻中为？",opt:["A.气海","B.髓海","C.血海","D.水谷之海"],ans:"A",exp:"膻中者，为气之海。"},
{q:"《灵枢·海论》胃为？",opt:["A.水谷之海","B.气海","C.髓海","D.血海"],ans:"A",exp:"胃者，水谷之海。"},
{q:"《灵枢·海论》冲脉为？",opt:["A.血海","B.髓海","C.气海","D.水谷之海"],ans:"A",exp:"冲脉为十二经之海，又称血海。"},
{q:"《灵枢·营卫生会》营气运行，周于身多少度为一周？",opt:["A.五十","B.二十八","C.三十六","D.六十四"],ans:"A",exp:"营卫五十而复大会，阴阳相贯，如环无端。"},
{q:"《灵枢·营卫生会》营气出于？",opt:["A.中焦","B.上焦","C.下焦","D.三焦"],ans:"A",exp:"营出于中焦，卫出于下焦。"},
{q:"《灵枢·营卫生会》卫气出于？",opt:["A.下焦","B.中焦","C.上焦","D.胃"],ans:"A",exp:"营出于中焦，卫出于下焦。"},
{q:"《灵枢·营卫生会》上焦如？",opt:["A.雾","B.沤","C.渎","D.渠"],ans:"A",exp:"上焦如雾，中焦如沤，下焦如渎。"},
{q:"《灵枢·营卫生会》中焦如？",opt:["A.沤","B.雾","C.渎","D.池"],ans:"A",exp:"中焦如沤。"},
{q:"《灵枢·营卫生会》下焦如？",opt:["A.渎","B.雾","C.沤","D.渊"],ans:"A",exp:"下焦如渎。"},
{q:"《灵枢·百病始生》风雨袭虚，则病起于？",opt:["A.上部","B.下部","C.五脏","D.六腑"],ans:"A",exp:"风雨袭虚，则病起于上；清湿袭虚，则病起于下；喜怒不节，则伤五脏。"},
{q:"《灵枢·百病始生》清湿袭虚，病起于？",opt:["A.下部","B.上部","C.经脉","D.募原"],ans:"A",exp:"清湿袭虚，则病起于下。"},
{q:"《灵枢·百病始生》喜怒不节，则伤？",opt:["A.五脏","B.六腑","C.皮肉","D.筋骨"],ans:"A",exp:"喜怒不节则伤脏，脏伤则病起于阴。"},
{q:"《灵枢·天年》四十岁，五脏六腑十二经脉，皆大盛以平定，腠理始？",opt:["A.疏","B.密","C.固","D.闭"],ans:"A",exp:"四十岁，五脏六腑十二经脉，皆大盛以平定，腠理始疏，荣华颓落。"}
];
let cur=0,ok=0,sel=false;
const qtext=document.getElementById("qtext");
const optbox=document.getElementById("optbox");
const ansbox=document.getElementById("ansbox");
const trueans=document.getElementById("trueans");
const exp=document.getElementById("exp");
const curDom=document.getElementById("cur");
const allDom=document.getElementById("all");
const okDom=document.getElementById("ok");
allDom.innerText=qList.length;
function render(){
sel=false;ansbox.style.display="none";
const item=qList[cur];
curDom.innerText=cur+1;
qtext.innerText=item.q;optbox.innerHTML="";
item.opt.forEach(o=>{
const d=document.createElement("div");
d.className="opt";d.innerText=o;
d.onclick=()=>{
if(sel)return;sel=true;
if(o[0]===item.ans){d.classList.add("right");ok++;okDom.innerText=ok;}
else d.classList.add("wrong");
document.querySelectorAll(".opt").forEach(x=>{if(x.innerText[0]===item.ans)x.classList.add("right");})
trueans.innerText=item.ans;exp.innerText=item.exp;ansbox.style.display="block";
}
optbox.appendChild(d);
})
}
document.getElementById("next").onclick=()=>{cur++;if(cur>=qList.length){alert(`完成！共${qList.length}题，答对${ok}题`);cur=0;}render();}
document.getElementById("reset").onclick=()=>{cur=0;ok=0;okDom.innerText=0;render();}
render();
</script>
</body>
</html>
